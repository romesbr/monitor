/* ---------------- painel ---------------- */

function abrirPainel() {
  el("acesso").style.display = "none";
  el("painel").classList.add("ver");
  el("cab-escopo").textContent =
    (acesso.tipo === "familia" ? "FAMÍLIA " : "GRUPO ") + acesso.nome.toUpperCase();

  iniciarMapa();
  iniciarTimeline();
  prepararModoParede();
  buscar();
  setInterval(buscar, INTERVALO_MS);

  /* O navegador do celular CONGELA os temporizadores da aba que vai para
     segundo plano — trocar de aplicativo basta. Quando a aba volta, o
     intervalo de 15 s pode ter passado minutos sem disparar, e a tela fica
     mostrando a última busca de antes da troca, com cara de atual.

     Relatado em campo em 10/08/2026: o site marcava 10:56 às 11:12, com o
     celular já tendo enviado tudo (fila de envio zerada). O dono tinha
     notado o efeito e atribuído à aba Monitor do app; era a volta ao
     navegador que descongelava a busca.

     Buscar assim que a aba reaparece custa uma requisição e devolve o
     painel ao presente na hora, em vez de esperar o próximo intervalo. */
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") buscar();
  });
  setInterval(pintarTudo, 30000);        // o tempo passa mesmo sem ponto novo
  setInterval(atualizarContato, 5000);   // e a idade do dado corre mais rápido
}

function iniciarMapa() {
  mapa = L.map("mapa").setView([-20.3155, -40.3128], 12);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: "&copy; OpenStreetMap"
  }).addTo(mapa);
  camadaCercas = L.layerGroup().addTo(mapa);
  camadaRota = L.layerGroup().addTo(mapa);
  mapa.on("click", (e) => {
    if (!desenhando) return;
    desenhando.push({ lat: e.latlng.lat, lng: e.latlng.lng });
    desenharCercas();
    atualizarBarraCerca();
  });
  el("b-centrar").onclick = () => { selecionado = null; enquadrado = false; pintarTudo(); };
  prepararBotoesDeCerca();
}

/* ---- desenhar cerca ponto a ponto, só para quem entra como família ---- */

function prepararBotoesDeCerca() {
  const barra = el("cercas-barra");
  barra.style.display = podeEditarCercas() ? "flex" : "none";
  if (!podeEditarCercas()) return;

  el("b-nova-cerca").onclick = () => {
    desenhando = [];
    atualizarBarraCerca();
    desenharCercas();
  };
  el("b-desfazer").onclick = () => {
    if (desenhando) desenhando.pop();
    desenharCercas();
    atualizarBarraCerca();
  };
  el("b-cancelar").onclick = () => {
    desenhando = null;
    atualizarBarraCerca();
    desenharCercas();
  };
  el("b-salvar").onclick = async () => {
    const nome = (prompt("Nome do lugar (é o que vai aparecer no lugar da coordenada):") || "").trim();
    const problema = validar(nome, desenhando);
    if (problema) { faixa(problema); return; }
    try {
      await salvarCerca(nome, desenhando);
      desenhando = null;
      cercas = await carregarCercas();
      faixa(null);
      atualizarBarraCerca();
      desenharCercas();
      pintarTudo();
    } catch (e) {
      faixa(e.message);
    }
  };
  atualizarBarraCerca();
}

function atualizarBarraCerca() {
  if (!podeEditarCercas()) return;
  const ativo = desenhando !== null;
  el("b-nova-cerca").style.display = ativo ? "none" : "";
  ["b-desfazer", "b-cancelar", "b-salvar"].forEach((i) => {
    el(i).style.display = ativo ? "" : "none";
  });
  el("b-salvar").disabled = !ativo || desenhando.length < 3;
  el("dica-cerca").textContent = ativo
    ? (desenhando.length < 3
        ? "Clique no mapa para marcar os cantos do lugar (mínimo 3)."
        : desenhando.length + " pontos — clique em Salvar quando fechar o contorno.")
    : "";
}

/**
 * As cercas existentes, mais a que está sendo desenhada. Elas ficam por baixo
 * da rota e dos pins: servem de fundo, não podem competir com o ativo.
 */
function desenharCercas() {
  if (!camadaCercas) return;
  camadaCercas.clearLayers();

  cercas.forEach((c) => {
    if (!c.pontos || c.pontos.length < 3) return;
    const poli = L.polygon(c.pontos.map((p) => [p.lat, p.lng]), {
      color: "#2E7D74", weight: 2, opacity: .8, fillColor: "#2E7D74", fillOpacity: .08,
    }).addTo(camadaCercas);
    poli.bindTooltip('<div class="balao"><div class="tit">' + escapar(c.nome) + "</div></div>",
      { direction: "top", className: "balao", opacity: 1 });
    if (podeEditarCercas()) {
      poli.on("click", async (ev) => {
        if (desenhando) return;               // desenhando, o clique é vértice
        L.DomEvent.stop(ev);
        if (!confirm('Apagar a cerca "' + c.nome + '"? Os lugares voltam a aparecer como coordenada.')) return;
        try {
          await removerCerca(c.id);
          cercas = await carregarCercas();
          desenharCercas();
          pintarTudo();
        } catch (e) { faixa(e.message); }
      });
    }
  });

  if (desenhando && desenhando.length) {
    desenhando.forEach((p) => {
      L.circleMarker([p.lat, p.lng], {
        radius: 4, color: "#16202B", weight: 2, fillColor: "#fff", fillOpacity: 1,
      }).addTo(camadaCercas);
    });
    if (desenhando.length > 1) {
      const contorno = fechar(desenhando);
      L.polyline(contorno.map((p) => [p.lat, p.lng]),
        { color: "#16202B", weight: 2, dashArray: "5 4" }).addTo(camadaCercas);
    }
  }
}

async function buscar() {
  try {
    aparelhos = await carregarAparelhos();
    await atualizarHistorico();
    await carregarContatos();
    ultimoContatoServidor = Date.now();
    falhaAtual = null;
    faixa(null);
  } catch (e) {
    // Falhou: NÃO limpa o que está na tela. Dado velho rotulado como velho
    // serve; tela vazia não serve para nada, e tela vazia num painel de
    // parede parece pátio sem locomotiva. Quem avisa é o indicador de
    // contato no cabeçalho, que continua contando a idade do dado.
    //
    // Também não desiste: o intervalo de 15 s segue chamando esta função,
    // e é essa repetição que faz o painel voltar sozinho quando a rede
    // volta — sem ninguém apertar nada (CONTEXTO-VTU 5.4).
    falhaAtual = e.message;
    faixa("Sem contato com o servidor (" + e.message +
      "). A tela mostra a última informação recebida e volta sozinha quando a rede voltar.");
    atualizarContato();
    return;
  }
  // As cercas mudam de vez em quando, não de 15 em 15 segundos: se o
  // servidor ainda não as tem, o monitor continua funcionando com
  // coordenadas em vez de nomes, e não é isso que vai derrubar a tela.
  try {
    cercas = await carregarCercas();
    desenharCercas();
  } catch (e) {
    cercas = [];
  }
  vinculos = await carregarVinculos();
  pintarTudo();
}

/* ---------------- idade do dado (CONTEXTO-VTU 2 e 5.4) ----------------
   Perda de sinal nunca pode ser silenciosa. Vale para o aparelho no pátio e
   vale para o próprio painel: um monitor que parou de receber tem a mesma
   cara de um pátio onde nada se move, e o programador não tem como saber a
   diferença olhando. Então a idade do dado fica escrita o tempo todo.
-------------------------------------------------------------------- */

const CONTATO_VELHO_MS = 60 * 1000;
const CONTATO_PERDIDO_MS = 3 * 60 * 1000;

function atualizarContato() {
  const caixa = el("contato");
  const texto = el("contato-txt");
  if (!caixa || !texto) return;

  if (!ultimoContatoServidor) {
    caixa.className = "contato";
    texto.textContent = falhaAtual ? "sem contato" : "conectando…";
    return;
  }
  const idade = Date.now() - ultimoContatoServidor;
  caixa.className = "contato" +
    (idade >= CONTATO_PERDIDO_MS ? " perdido" : idade >= CONTATO_VELHO_MS ? " velho" : "");
  texto.textContent = idade < 20000
    ? "ao vivo · " + relogioMs(ultimoContatoServidor)
    : "sem atualizar há " + duracao(idade);
}

/* ---------------- modo painel de parede (CONTEXTO-VTU 5.4) ----------------
   O que o gerente descreveu é uma tela sempre ligada ao lado do programador,
   lida de alguns metros e de pé — não um site que alguém abre e fecha. Aqui
   isso é: letra grande, sem os controles que ninguém opera a essa distância,
   tela cheia sem barra de navegador, e a tela sem apagar sozinha.

   A escolha fica guardada: quem liga o painel de manhã não deve ter de
   reconfigurá-lo todo dia.
------------------------------------------------------------------------ */

const CHAVE_PAREDE = "rastreio.monitor.parede";
let travaDeTela = null;

async function segurarTela() {
  // wakeLock não existe em todo navegador, e some sozinho quando a aba perde
  // o foco. Falhar aqui não pode derrubar nada: no pior caso a tela apaga e
  // alguém encosta no mouse.
  try {
    if (!("wakeLock" in navigator)) return;
    travaDeTela = await navigator.wakeLock.request("screen");
  } catch (e) {}
}

function aplicarParede(ligado) {
  document.body.classList.toggle("parede", ligado);
  el("b-parede").textContent = ligado ? "Sair do painel" : "Painel";
  try { localStorage.setItem(CHAVE_PAREDE, ligado ? "1" : "0"); } catch (e) {}
  // A grade mudou de tamanho; sem isto o Leaflet desenha o mapa no espaço
  // antigo e sobra uma faixa cinza.
  if (mapa) setTimeout(function () { mapa.invalidateSize(); }, 60);
  if (ligado) segurarTela();
}

function prepararModoParede() {
  let ligado = false;
  try { ligado = localStorage.getItem(CHAVE_PAREDE) === "1"; } catch (e) {}
  aplicarParede(ligado);

  el("b-parede").onclick = function () {
    const novo = !document.body.classList.contains("parede");
    aplicarParede(novo);
    // Tela cheia só pode ser pedida dentro de um clique — por isso mora aqui
    // e não na hora de restaurar a preferência.
    try {
      if (novo) document.documentElement.requestFullscreen();
      else if (document.fullscreenElement) document.exitFullscreen();
    } catch (e) {}
  };

  // A trava de tela cai quando a aba vai para segundo plano e não volta
  // sozinha. Sem isto, o painel apaga depois da primeira vez que alguém
  // troca de janela.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" &&
        document.body.classList.contains("parede")) {
      segurarTela();
    }
  });
}

/* ---------------- desenho ---------------- */

function pintarTudo() {
  /* A conta do cabeçalho passa a ser a do MAPA, não a do inventário: quem
     aguarda loco não é ativo em operação, e somar os dois dava um número
     que não batia com os pins na tela. */
  const esperando = aparelhos.filter((a) => aguardandoLoco(chaveDe(a))).length;
  const emLoco = aparelhos.length - esperando;
  el("cab-titulo").textContent = !aparelhos.length
    ? "Nenhum aparelho ainda"
    : emLoco + (emLoco === 1 ? " ativo" : " ativos") +
      (esperando ? " · " + esperando + " aguardando loco" : "");
  desenharPins();
  desenharRota();
  desenharPainelLateral();
  atualizarRotuloTempo();
  atualizarContato();
}

/**
 * Um pin por ativo, sempre todos, na posição do instante mostrado. O mapa
 * abre assim (item 5): a rota só entra quando alguém escolhe um ativo.
 */
function desenharPins() {
  const vivos = new Set();

  aparelhos.forEach((a) => {
    const chave = chaveDe(a);
    const estado = estadoDe(chave);
    if (!estado.posicao) return;
    /* Sem loco atrelada não vira pin — mas com DUAS exceções, e a segunda é
       regra de contexto, não capricho.

       A primeira é o escolhido: quem clicou nele na lista "Aguarda loco"
       está pedindo para ver o histórico, e trilha sem pin na ponta parece
       defeito, não decisão.

       A segunda: aparelho sem vínculo que está EM MOVIMENTO continua no
       mapa. Celular guardado na gaveta fica parado; o que anda está dentro
       de uma loco trabalhando, e o que falta nele é cadastro, não operação.
       Deixar esse sumir seria esconder um ativo em serviço por causa de um
       esquecimento de vínculo — exatamente o que o CONTEXTO-VTU 2 proíbe:
       "errar para o lado de sinalizar é aceitável; deixar passar em
       silêncio, não". */
    if (aguardandoLoco(chave) && !estado.emMovimento && selecionado !== chave) return;
    vivos.add(chave);

    const onde = [estado.posicao.lat, estado.posicao.lng];
    let pin = pins.get(chave);
    if (!pin) {
      pin = L.marker(onde, { icon: iconePin(estado, false) }).addTo(mapa);
      pin.on("click", () => {
        selecionado = selecionado === chave ? null : chave;
        enquadrado = false;
        pintarTudo();
      });
      pins.set(chave, pin);
    } else {
      pin.setLatLng(onde);
      pin.setIcon(iconePin(estado, selecionado === chave));
    }
    pin.bindTooltip(balaoAtivo(chave, estado), {
      direction: "top", className: "balao", opacity: 1,
    });
  });

  // Aparelho que sumiu da lista do servidor não pode deixar pin órfão.
  [...pins.keys()].forEach((chave) => {
    if (!vivos.has(chave)) { pins.get(chave).remove(); pins.delete(chave); }
  });

  if (!enquadrado && pins.size) {
    const alvos = selecionado && pins.has(selecionado) ? [pins.get(selecionado)] : [...pins.values()];
    mapa.fitBounds(L.latLngBounds(alvos.map((p) => p.getLatLng())),
      { padding: [60, 60], maxZoom: selecionado ? 16 : 15 });
    enquadrado = true;
  }
}

/**
 * A rota das últimas 24 h do ativo escolhido: a linha, um pontinho a cada
 * 500 m percorridos e um balão em cada parada. Só do escolhido — com todos
 * ao mesmo tempo o mapa vira um rabisco.
 */
function desenharRota() {
  camadaRota.clearLayers();
  if (!selecionado) return;

  const pontos = janelaDe(selecionado, HORAS_ROTA);
  const t = prepararTrilha(pontos);
  if (t.trilha.length > 1) {
    L.polyline(t.trilha.map((p) => [p.lat, p.lng]),
      { color: "#16202B", weight: 3, opacity: .55, lineJoin: "round" }).addTo(camadaRota);
    // marcosDeDistancia vem do núcleo: é a mesma conta que o app faz.
    /* Setinha apontada para onde o aparelho ia, e não um pontinho cego.
       Num pátio de manobra é ela que diz se a loco foi ou voltou pelo MESMO
       trilho — dois marcos redondos no mesmo lugar contam a mesma história
       para ida e para volta, e é justamente essa diferença que interessa a
       quem mede ocupação.

       O `rumo` (graus, 0 = norte) já vinha pronto do núcleo desde sempre, e
       o site nunca o usou: os marcos eram `circleMarker`. O app já desenhava
       a seta na tela dele (`src/TelaMonitor.js`), então aqui é o mesmo
       desenho, para as duas telas contarem a mesma coisa do mesmo jeito. */
    marcosDeDistancia(t.trilha).forEach((m) => {
      const icone = L.divIcon({
        className: "", iconSize: [14, 14], iconAnchor: [7, 7],
        html: '<div style="width:14px;height:14px;transform:rotate(' + m.rumo + 'deg)">' +
              '<svg width="14" height="14" viewBox="0 0 14 14">' +
              '<path d="M7 1 L12 12 L7 9.3 L2 12 Z" fill="#16202B" stroke="#fff" stroke-width="1"/>' +
              "</svg></div>",
      });
      L.marker([m.lat, m.lng], { icon: icone }).bindTooltip(
        '<span class="marco">' + relogio(m.hora) + " · " + (m.metros / 1000).toFixed(1) + " km</span>",
        { direction: "top", className: "balao", opacity: 1 }
      ).addTo(camadaRota);
    });
  }

  /* Buraco de silêncio (item 3): o traço reto entre duas leituras distantes no
     TEMPO tem a mesma cara de um trecho percorrido de verdade, e vira "passou
     por aqui" no mapa sem que ninguém saiba que aquilo é chute.

     O app já desenhava isto desde sempre (`src/TelaMonitor.js`); o site não —
     `trechosDeSilencio` estava no núcleo e nunca era chamado aqui. As duas
     telas precisam contar a mesma história, então é o mesmo desenho: tracejado
     cinza por cima da linha cheia, com um marco no meio do vão.

     O balão diz a distância EM LINHA RETA de propósito. Ela não é o quanto a
     loco andou — no buraco ela pode ter ido e voltado dez vezes, ou não ter
     saído do lugar. É o mínimo que se pode afirmar, e é assim que está escrito. */
  trechosDeSilencio(pontos).forEach((s) => {
    L.polyline([[s.de.lat, s.de.lng], [s.para.lat, s.para.lng]],
      { color: "#8A94A6", weight: 3, opacity: .8, dashArray: "2 7", lineCap: "round" }
    ).addTo(camadaRota);
    L.circleMarker([s.lat, s.lng], {
      radius: 6, color: "#8A94A6", weight: 2,
      fillColor: "#fff", fillOpacity: 1, dashArray: "2 3"
    }).bindTooltip(
      '<div class="balao"><div class="tit">Sem notícia</div>' +
      "<div>" + relogioMs(s.inicio) + " às " + relogioMs(s.fim) + "</div>" +
      '<div class="cinza">' + duracao(s.duracaoMs) + " no escuro · " +
      (s.metros >= 1000 ? (s.metros / 1000).toFixed(1) + " km" : Math.round(s.metros) + " m") +
      " em linha reta</div>" +
      '<div class="cinza">Não se sabe por onde passou.</div></div>',
      { direction: "top", className: "balao", opacity: 1 }
    ).addTo(camadaRota);
  });

  calcularTrechos(pontos).forEach((tr) => {
    if (tr.tipo !== "parada" || !tr.ancora) return;
    L.circleMarker([tr.ancora.lat, tr.ancora.lng], {
      radius: 6, color: "#16202B", weight: 2, fillColor: "#EDF1F5", fillOpacity: .9
    }).bindTooltip(
      '<div class="balao"><div class="tit">Parada</div>' +
      "<div>" + relogioMs(tr.inicio) + " às " + relogioMs(tr.fim) + "</div>" +
      '<div class="cinza">' + duracao(tr.fim - tr.inicio) + " · " +
      escapar(lugarDe(tr.ancora)) + "</div></div>",
      { direction: "top", className: "balao", opacity: 1 }
    ).addTo(camadaRota);
  });
}

/* ---------------- lista e detalhe (item 8) ---------------- */

function desenharPainelLateral() {
  const c = el("lista");
  c.innerHTML = "";

  if (!aparelhos.length) {
    c.innerHTML = '<p style="font-size:14px;line-height:1.5;color:var(--suave);padding:8px 2px">'
      + "Nenhum aparelho enviou dados ainda. Ligue o rastreio no app do celular.</p>";
    return;
  }
  if (selecionado) { desenharDetalhe(c); return; }

  /* O item é o mesmo nos dois blocos, então nasce aqui uma vez só. Para quem
     aguarda loco, o status vira o próprio "Aguarda loco": parado/andando é
     resposta para uma pergunta que ninguém faz sobre celular que não está
     atrelado a nada. O resto da linha continua igual — lugar e hora da
     última posição — porque é justamente o que não pode se perder.

     A exceção é o aparelho sem vínculo que está EM MOVIMENTO: esse não é
     inventário, é loco trabalhando com cadastro faltando. Ele fica em cor de
     alerta e diz o que está errado, em vez de descer calado para o fim da
     lista (CONTEXTO-VTU 2). */
  const montarItem = (a, esperando) => {
    const chave = chaveDe(a);
    const e = estadoDe(chave);
    const semVinculoAndando = esperando && e.emMovimento;
    const d = document.createElement("div");
    d.className = "item";
    d.innerHTML =
      '<span class="bola" style="background:' +
        (semVinculoAndando ? "var(--morno)"
          : esperando ? "var(--parado)"
          : (COR_FAROL[e.farol] || "var(--parado)")) + '"></span>' +
      '<div class="corpo">' +
        '<div class="nome"><span class="n"></span>' +
          '<span class="' + (e.sinal.mudo ? "mudo" : "") + '">' + ondas(e.sinal.barras) + "</span>" +
        "</div>" +
        '<div class="campo"><b class="st"></b></div>' +
        '<div class="campo lc"></div>' +
      "</div>";
    // O prefixo da loco, não o nome do celular (CONTEXTO-VTU 5.1). Sem
    // vínculo cadastrado, cai no nome do aparelho — a tela diz o que sabe.
    d.querySelector(".n").textContent = rotuloDe(chave);
    d.querySelector(".st").textContent = semVinculoAndando
      ? "Sem vínculo · " + textoStatus(e)
      : esperando ? "Aguarda loco" : textoStatus(e);
    if (semVinculoAndando) d.querySelector(".st").style.color = "var(--morno)";
    d.querySelector(".lc").textContent = lugarDe(e.posicao) +
      " · última posição " + relogioMs(e.ultimoContatoMs);
    d.onclick = () => { selecionado = chave; enquadrado = false; pintarTudo(); };
    return d;
  };

  const esperando = aparelhos.filter((a) => aguardandoLoco(chaveDe(a)));
  const emLoco = aparelhos.filter((a) => !aguardandoLoco(chaveDe(a)));

  const grupos = [];
  emLoco.forEach((a) => { if (grupos.indexOf(a.grupo) < 0) grupos.push(a.grupo); });

  grupos.forEach((g) => {
    const t = document.createElement("div");
    t.className = "secao";
    t.textContent = g;
    c.appendChild(t);

    emLoco.filter((a) => a.grupo === g).forEach((a) => c.appendChild(montarItem(a, false)));
  });

  /* A lista separada vem sempre por último: é inventário parado, não
     operação. E só aparece quando tem alguém nela — seção vazia é ruído
     permanente numa tela que fica ligada o dia inteiro. */
  if (esperando.length) {
    const t = document.createElement("div");
    t.className = "secao";
    t.textContent = "Aguarda loco";
    c.appendChild(t);
    esperando.forEach((a) => c.appendChild(montarItem(a, true)));
  }
}

function desenharDetalhe(c) {
  const e = estadoDe(selecionado);
  const pontos = janelaDe(selecionado, HORAS_ROTA);
  const trechos = calcularTrechos(pontos);
  const lugares = resumoPorLugar(trechos, lugarDe);
  const s = e.sinal;

  // A cobertura do MESMO período dos totais logo abaixo (CONTEXTO-VTU 5.2).
  // Sem ela, "parado 3h40" é um número sem denominador: ninguém sabe se o
  // rastreio esteve vivo essas 3h40 inteiras, e o primeiro questionamento
  // derruba o número junto com a credibilidade do resto.
  // Recebe o histórico inteiro, não a janela: a última notícia ANTES do
  // começo do período é o que diz se ele começou coberto ou no escuro.
  const fim = relogioAtual();
  const cob = cobertura(historico.get(selecionado) || [],
    fim - HORAS_ROTA * 3600 * 1000, fim);

  const voltar = document.createElement("div");
  voltar.className = "volta";
  voltar.textContent = "← todos os ativos";
  voltar.onclick = () => { selecionado = null; enquadrado = false; pintarTudo(); };
  c.appendChild(voltar);

  const caixa = document.createElement("div");
  caixa.className = "detalhe";
  caixa.innerHTML =
    "<h2></h2>" +
    '<div class="kicker" style="margin-top:2px"></div>' +
    '<div style="margin-top:12px">' +
      '<div class="linha-campo"><span class="rot">Status</span><span class="val st"></span></div>' +
      '<div class="linha-campo"><span class="rot">Localidade</span><span class="val lc"></span></div>' +
      '<div class="linha-campo"><span class="rot">Sinal</span><span class="val sn"></span></div>' +
      '<div class="linha-campo"><span class="rot">Última posição</span><span class="val up"></span></div>' +
      '<div class="linha-campo"><span class="rot">Último dado</span><span class="val ud"></span></div>' +
      '<div class="linha-campo"><span class="rot">Locomotiva</span><span class="val lo"></span></div>' +
    "</div>" +
    '<div class="gps" style="font-size:12px;color:var(--morno);line-height:1.5;margin-top:8px"></div>' +
    '<div class="vinc-barra" style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap"></div>' +
    '<div class="secao">Onde ficou nas últimas ' + HORAS_ROTA + " h</div>" +
    '<div class="cob" style="font-size:12px;color:var(--suave);line-height:1.5;margin-bottom:6px"></div>' +
    '<div class="lugares"></div>' +
    '<div class="secao">Trechos</div>' +
    '<div class="trechos"></div>';

  const aparelho = nomeDe(selecionado);
  const grupo = grupoDe(selecionado);
  const loco = prefixoEm(vinculos, grupo, aparelho, fim);

  caixa.querySelector("h2").textContent = rotuloDe(selecionado);
  caixa.querySelector(".kicker").textContent = grupo + " · aparelho " + aparelho;
  caixa.querySelector(".st").textContent = textoStatus(e);
  caixa.querySelector(".st").style.color = COR_FAROL[e.farol] || "";
  /* A localidade ganha "há quanto tempo NESTE lugar", que é pergunta
     diferente de "há quanto tempo parado". No pátio a loco manobra e
     estaciona várias vezes sem sair da cerca: pelo status ela está parada
     há 20 min, pelo lugar está no Pátio há 3 h. Quem mede ocupação de
     ativo quer o segundo número. */
  const noLugar = tempoNoLugar(historico.get(selecionado) || [], cercas, fim);
  caixa.querySelector(".lc").textContent =
    lugarDe(e.posicao) + (noLugar ? " · há " + duracao(noLugar) : "");
  caixa.querySelector(".sn").innerHTML = ondas(s.barras) + " " +
    escapar(s.mudo ? "sem sinal há " + duracao(s.minutos * 60000)
      : s.nivel === "fraco" ? "fraco" : "bom");
  /* Dois campos, e a diferença entre eles é o ponto todo.
     "Última posição" é quando o aparelho mandou uma posição de verdade —
     com a loco parada, isso acontece de 10 em 10 min (item 2), então esse
     carimbo fica velho SEM que nada esteja errado.
     "Último dado" é a última notícia de qualquer tipo, inclusive a leitura
     crua de 30 em 30 s. É a prova de que o aparelho está vivo agora.
     Antes havia só o primeiro, e ele significava as duas coisas opostas:
     parado e saudável, ou morto há dez minutos. */
  const ultimaPos = ultimaPosicaoMs(selecionado);
  const alvoUp = caixa.querySelector(".up");
  alvoUp.textContent = ultimaPos
    ? relogioMs(ultimaPos) + " (" + duracao(fim - ultimaPos) + ")"
    : "—";
  /* Aparelho falando e sem saber onde está: o caso do CEL Leo em 12/08/2026.
     Sinal cheio, "último dado" de segundos atrás, e o pin três horas atrasado
     porque só chegava posição grosseira. Nenhum dos campos mentia sozinho —
     era preciso comparar os dois para desconfiar, e ninguém compara.
     GPS_MUDO_MS é generoso de propósito: parado, a posição vem de 10 em 10
     min (item 2), então só depois de perder três dessas é que há o que dizer.

     O `!s.mudo` é o conserto do dia 13/08/2026, e o defeito era meu: sem ele o
     aviso saía também para aparelho DESLIGADO. No Cel li, calado desde a
     véspera, o painel mostrava "sem sinal há 16h55" e logo abaixo "o aparelho
     está enviando dados" — duas linhas coladas dizendo o contrário uma da
     outra. A conta olhava só a distância entre os dois carimbos, e num
     aparelho morto os dois são velhos: a diferença continua lá, e o aviso
     disparava do mesmo jeito.

     A frase só faz sentido para quem está falando AGORA e mesmo assim não
     sabe onde está. Sem sinal, quem explica é a linha "sem sinal há tanto", e
     este aviso vira mentira em cima dela. */
  const GPS_MUDO_MS = 35 * 60 * 1000;
  const semGps =
    !s.mudo && ultimaPos != null && e.ultimoContatoMs != null &&
    e.ultimoContatoMs - ultimaPos >= GPS_MUDO_MS;
  alvoUp.style.color = semGps ? "var(--morno)" : "";
  const alvoGps = caixa.querySelector(".gps");
  alvoGps.textContent = semGps
    ? "O aparelho está enviando dados, mas sem posição confiável há " +
      duracao(fim - ultimaPos) + ". O pin está no último lugar conhecido, " +
      "não onde ele está agora."
    : "";
  caixa.querySelector(".ud").textContent = e.ultimoContatoMs
    ? relogioMs(e.ultimoContatoMs) + " (" + duracao(fim - e.ultimoContatoMs) + ")"
    : "—";
  caixa.querySelector(".lo").textContent = loco || "sem vínculo";
  if (!loco) caixa.querySelector(".lo").style.color = "var(--suave)";

  montarBotoesDeVinculo(caixa.querySelector(".vinc-barra"), grupo, aparelho, loco);

  const alvoCob = caixa.querySelector(".cob");
  if (cob.percentual == null) {
    alvoCob.textContent = "";
  } else {
    alvoCob.textContent = "Rastreio vivo em " + textoCobertura(cob) +
      (cob.mudoMs > 0 ? " · " + duracao(cob.mudoMs) + " sem notícia" : "") +
      ". Os tempos abaixo valem para o que foi observado.";
    if (cob.percentual < 90) alvoCob.style.color = "var(--morno)";
  }

  const alvoLugares = caixa.querySelector(".lugares");
  if (!lugares.length) {
    alvoLugares.innerHTML = '<p class="campo" style="color:var(--suave)">Sem parada registrada no período.</p>';
  } else {
    lugares.forEach((l) => {
      const d = document.createElement("div");
      d.className = "lugar";
      d.innerHTML = '<span class="nom"></span><span class="dur"></span>';
      d.querySelector(".nom").textContent = l.lugar + (l.visitas > 1 ? " (" + l.visitas + "×)" : "");
      d.querySelector(".dur").textContent = duracao(l.total);
      alvoLugares.appendChild(d);
    });
  }

  /* A lista de trechos mostra o PERÍODO INTEIRO, não o pedaço até o instante
     arrastado — e é essa a diferença que o dono pediu em 13/08/2026.

     Antes ela era recortada junto com o resto do painel: arrastar a régua para
     as 10h fazia a lista encolher para o que havia até as 10h, e o resto do dia
     sumia. Dava para ver o instante, não dava para ver o dia.

     Agora o dia fica inteiro na tela e quem se move é uma MARCA: o trecho que
     contém o instante da régua ganha a barra vermelha, e o que vem depois dele
     esmaece. Arrastando, a marca desce pela lista e se lê onde a régua está
     dentro do dia sem perder o contexto do que veio antes e do que vem depois.

     Pin, status e localidade continuam presos ao instante — é para isso que a
     timeline existe. Só a lista passou a ser âncora em vez de recorte. */
  const alvoTrechos = caixa.querySelector(".trechos");
  const agoraDeVerdade = Date.now();
  const trechosDoPeriodo = calcularTrechos(
    janelaAte(selecionado, HORAS_ROTA, agoraDeVerdade));
  const emOrdem = trechosDoPeriodo.slice().reverse();
  if (!emOrdem.length) {
    alvoTrechos.innerHTML = '<p class="campo" style="color:var(--suave)">Sem histórico no período.</p>';
  } else {
    let marcado = null;
    emOrdem.forEach((t) => {
      const d = document.createElement("div");
      d.className = "lugar";
      // O instante cai DENTRO deste trecho? O primeiro que couber leva a marca:
      // a lista vem do mais novo para o mais velho, então é o certo.
      const contem = fim >= t.inicio && fim <= t.fim;
      if (contem && !marcado) { d.classList.add("agora"); marcado = d; }
      else if (t.inicio > fim) d.classList.add("depois");
      d.innerHTML = '<span class="nom"></span><span class="dur"></span>';
      d.querySelector(".nom").textContent = relogioMs(t.inicio) + " · " +
        (t.tipo === "parada" ? lugarDe(t.ancora) : "em movimento");
      d.querySelector(".dur").textContent = duracao(t.fim - t.inicio);
      alvoTrechos.appendChild(d);
    });
    /* Sem trecho que contenha o instante (buraco de silêncio entre dois), a
       marca vai para o primeiro trecho ANTERIOR a ele: é onde o ativo estava
       da última vez que se soube. Melhor marcar o último lugar conhecido do
       que deixar a lista sem referência nenhuma. */
    if (!marcado) {
      const anterior = [...alvoTrechos.children].find(
        (_, i) => emOrdem[i] && emOrdem[i].fim <= fim);
      if (anterior) anterior.classList.add("agora");
    }
    // Arrastar longe deixaria a marca fora da tela: traz ela de volta.
    const alvo = alvoTrechos.querySelector(".agora");
    if (alvo && instante != null) alvo.scrollIntoView({ block: "nearest" });
  }

  c.appendChild(caixa);
}

/**
 * Vincular e encerrar a locomotiva deste aparelho.
 *
 * Trocar de loco NÃO apaga o vínculo anterior: fecha o antigo no instante em
 * que o novo começa. O percurso de ontem continua sendo da loco de ontem —
 * é essa a razão de o vínculo ter vigência, e é o que separa um histórico
 * que se pode citar de um que mente sobre o passado.
 */
function montarBotoesDeVinculo(barra, grupo, aparelho, loco) {
  if (!podeEditarVinculos()) {
    if (!loco) {
      barra.innerHTML = '<span style="font-size:12px;color:var(--suave);line-height:1.5">' +
        "Entre com a senha da família para dar o prefixo da locomotiva a este aparelho.</span>";
    }
    return;
  }

  const botao = (texto, aoClicar) => {
    const b = document.createElement("button");
    b.className = "fantasma";
    b.textContent = texto;
    b.onclick = aoClicar;
    barra.appendChild(b);
  };

  const recarregar = async () => {
    vinculos = await carregarVinculos();
    pintarTudo();
  };

  botao(loco ? "Trocar de locomotiva" : "Vincular locomotiva", async () => {
    const prefixo = (prompt(
      "Prefixo da locomotiva que está com o aparelho \"" + aparelho + "\":",
      loco || ""
    ) || "").trim();
    if (!prefixo) return;
    try {
      await criarVinculo(grupo, aparelho, prefixo);
      faixa(null);
      await recarregar();
    } catch (e) {
      faixa(e.message);
    }
  });

  if (!loco) return;

  botao("Encerrar vínculo", async () => {
    const aberto = vinculoEm(vinculos, grupo, aparelho, Date.now());
    if (!aberto || aberto.ate != null) { faixa("Não há vínculo aberto para encerrar."); return; }
    if (!confirm("Encerrar o vínculo do aparelho \"" + aparelho + "\" com a locomotiva " +
      loco + "?\n\nO histórico até agora continua sendo dela.")) return;
    try {
      await fecharVinculo(aberto.id);
      faixa(null);
      await recarregar();
    } catch (e) {
      faixa(e.message);
    }
  });
}

/* ---------------- timeline (item 6) ----------------
   A barra anda em minutos ao longo dos últimos 7 dias e o extremo direito é
   sempre o agora. Arrastar não busca nada no servidor: o histórico já está
   aqui, e o que muda é o relógio com que tudo é recalculado — pins, farol,
   status e rota voltam juntos para aquele momento.
--------------------------------------------------- */

const MINUTOS_TIMELINE = DIAS_TIMELINE * 24 * 60;

/* ---------------- extração ---------------- */

/**
 * O dia de cada ativo em CSV, um trecho por linha.
 *
 * Colunas fechadas com o dono em 13/08/2026:
 *   Loco | Área | Status | Início | Fim
 *
 * "Área" é o nome da cerca quando o ponto cai dentro de uma, e a coordenada
 * quando não cai — a mesma regra que o painel usa, para o arquivo e a tela
 * nunca discordarem sobre onde o ativo estava.
 *
 * O buraco de silêncio entra como linha, com status "Sem sinal". Deixar ele
 * de fora faria as horas fecharem certinho num arquivo que esconde justamente
 * o período em que ninguém viu nada — e é esse arquivo que vira cobrança.
 */
function montarCsv() {
  const fim = Date.now();
  const linhas = [["Loco", "Area", "Status", "Inicio", "Fim"]];

  for (const a of aparelhos) {
    const chave = chaveDe(a);
    const pontos = janelaAte(chave, HORAS_ROTA, fim);
    if (!pontos.length) continue;
    const grupo = grupoDe(chave);
    const aparelho = nomeDe(chave);

    const eventos = calcularTrechos(pontos).map((t) => ({
      inicio: t.inicio, fim: t.fim,
      status: t.tipo === "parada" ? "Parado" : "Em deslocamento",
      onde: t.tipo === "parada" && t.ancora ? lugarDe(t.ancora) : "",
    }));
    for (const b of trechosDeSilencio(pontos)) {
      eventos.push({ inicio: b.inicio, fim: b.fim, status: "Sem sinal",
                     onde: lugarDe({ lat: b.lat, lng: b.lng }) });
    }
    eventos.sort((x, y) => x.inicio - y.inicio);

    for (const ev of eventos) {
      // A loco do INSTANTE do trecho, não a de agora: um aparelho que trocou
      // de locomotiva no meio do período tem de sair com a certa em cada linha.
      linhas.push([
        prefixoEm(vinculos, grupo, aparelho, ev.inicio) || aparelho,
        ev.onde || lugarDe(estadoAtual(pontos, ev.inicio).posicao),
        ev.status,
        dataHoraLocal(ev.inicio),
        dataHoraLocal(ev.fim),
      ]);
    }
  }
  return linhas;
}

/* Ponto e vírgula, e não vírgula: é o separador que o Excel em português
   entende sem pedir importação. O BOM na frente é o que faz acento aparecer
   certo — sem ele, "Pátio" vira "PÃ¡tio" na planilha do dono. */
const paraCsv = (linhas) =>
  "\ufeff" + linhas.map((l) => l.map((c) => {
    const t = String(c ?? "");
    return /[";\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  }).join(";")).join("\r\n");

function baixarCsv() {
  const linhas = montarCsv();
  if (linhas.length < 2) { alert("Nenhum trecho no período para exportar."); return; }
  const blob = new Blob([paraCsv(linhas)], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "rastreio-" + diaLocal(Date.now()) + ".csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  // Sem isto o blob fica na memória do navegador até a aba fechar, e o painel
  // de parede não fecha nunca.
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function iniciarTimeline() {
  const barra = el("t-barra");
  barra.max = String(MINUTOS_TIMELINE);
  barra.value = String(MINUTOS_TIMELINE);

  barra.addEventListener("input", () => {
    const atras = MINUTOS_TIMELINE - Number(barra.value);
    instante = atras === 0 ? null : Date.now() - atras * 60000;
    pintarTudo();
  });
  el("b-csv").onclick = baixarCsv;
  el("b-agora").onclick = () => {
    instante = null;
    barra.value = String(MINUTOS_TIMELINE);
    pintarTudo();
  };
  atualizarRotuloTempo();
}

function atualizarRotuloTempo() {
  const passado = instante != null;
  el("tempo").classList.toggle("passado", passado);
  el("t-quando").textContent = passado ? diaEHora(instante) : "agora · " + diaEHora(Date.now());
}

/* ---------------- início ---------------- */

const salvo = recuperar();
if (salvo && salvo.nome && salvo.senha) {
  acesso = salvo;
  abrirPainel();
} else {
  el("i-nome").focus();
}
</script>
