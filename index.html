<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Monitor · Rastreio</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

<style>
:root{
  --tinta:#16202B; --suave:#5A6B7C; --linha:#D4DCE4;
  --papel:#EDF1F5; --cartao:#FFF; --parado:#98A6B4;
  --vivo:#2E7D74; --morno:#C08A2E; --frio:#B5563F; --andando:#2F6DB5;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter Tight',system-ui,sans-serif;color:var(--tinta);
  background:var(--papel);-webkit-font-smoothing:antialiased}
.kicker{font-family:'JetBrains Mono',monospace;font-size:10px;
  letter-spacing:.16em;color:var(--suave);text-transform:uppercase}
h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-.02em}

#acesso{height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.caixa{width:100%;max-width:390px}
.caixa h1{font-size:29px;line-height:1.05;margin:6px 0 14px}
.cartao{background:var(--cartao);border:1px solid var(--linha);border-radius:12px;padding:18px}
label{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--suave);margin-bottom:5px}
input[type=text],input[type=password]{width:100%;font-family:'Inter Tight',sans-serif;
  font-size:16px;padding:11px 12px;border:1px solid var(--linha);border-radius:10px;
  background:#fff;color:var(--tinta);margin-bottom:14px}
input:focus{outline:2px solid var(--tinta);outline-offset:1px}
.lembrar{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--suave);margin-bottom:16px}
button{font-family:'Inter Tight',sans-serif;font-size:15px;font-weight:600;
  padding:12px 16px;border-radius:10px;border:1px solid var(--tinta);
  background:var(--tinta);color:#fff;cursor:pointer;width:100%}
button:hover{opacity:.87}
button.fantasma{background:transparent;color:var(--tinta);border-color:var(--linha);
  width:auto;font-size:13px;padding:8px 12px;font-weight:500}
.nivel{display:flex;gap:8px;margin:14px 0}
.nivel button{flex:1;background:transparent;color:var(--tinta);
  border-color:var(--linha);font-size:13px;padding:10px;font-weight:600}
.nivel button.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.erro{color:var(--frio);font-size:13px;line-height:1.45;margin-top:12px}
.rodape{font-size:13px;line-height:1.5;color:var(--suave);margin-top:16px}

#painel{display:none;height:100%;grid-template-columns:320px 1fr;grid-template-rows:auto 1fr auto}
#painel.ver{display:grid}
header{grid-column:1/-1;background:var(--cartao);border-bottom:1px solid var(--linha);
  padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:20px}
.cabeca-dir{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

aside{background:var(--cartao);border-right:1px solid var(--linha);overflow-y:auto;padding:14px}
.secao{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--suave);margin:16px 0 8px}
.secao:first-child{margin-top:2px}

/* ---- lista de ativos: os campos do item 8 ficam em linhas separadas ---- */
.item{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:9px;
  cursor:pointer;border:1px solid transparent}
.item:hover{background:var(--papel)}
.item.on{background:var(--papel);border-color:var(--linha)}
.item .corpo{min-width:0;flex:1}
.item .nome{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.item .campo{font-size:13px;color:var(--suave);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .campo b{font-weight:600;color:var(--tinta)}
.bola{width:11px;height:11px;border-radius:50%;flex:none;margin-top:5px}
.mudo{opacity:.45}
.ondas{flex:none;vertical-align:-1px}

/* ---- detalhe do ativo (a lista vira isto ao clicar num pin) ---- */
.volta{font-size:13px;color:var(--suave);cursor:pointer;display:inline-block;margin-bottom:10px}
.volta:hover{color:var(--tinta)}
.detalhe h2{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:800}
.linha-campo{display:flex;justify-content:space-between;gap:12px;padding:8px 0;
  border-bottom:1px solid var(--linha);font-size:14px}
.linha-campo .rot{color:var(--suave)}
.linha-campo .val{text-align:right;font-weight:600}
.lugar{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0}
.lugar .nom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lugar .dur{font-family:'JetBrains Mono',monospace;color:var(--suave);flex:none}

main{position:relative;min-height:0}
#mapa{height:100%;background:#DFE6ED}

/* ---- timeline (item 6) ---- */
.tempo{grid-column:1/-1;background:var(--cartao);border-top:1px solid var(--linha);
  padding:10px 18px 12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tempo .quando{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;
  min-width:190px;flex:none}
.tempo input[type=range]{flex:1;min-width:200px;margin:0;accent-color:var(--tinta)}
.tempo .agora-btn{width:auto;font-size:13px;padding:7px 12px;background:transparent;
  color:var(--tinta);border-color:var(--linha);font-weight:500;flex:none}
.tempo.passado .quando{color:var(--morno)}

.faixa{grid-column:1/-1;padding:12px 18px;background:#FBF0E4;
  border-top:1px solid var(--linha);font-size:13px;line-height:1.5;display:none}
.faixa.ver{display:block}

/* ---- pin e balões ---- */
.pin{filter:drop-shadow(0 2px 4px rgba(0,0,0,.35));cursor:pointer}
.pin.apagado{opacity:.45}
.leaflet-tooltip.balao{font-family:'Inter Tight',sans-serif;font-size:13px;line-height:1.5;
  padding:8px 10px;border-radius:9px;border:1px solid var(--linha);color:var(--tinta)}
.balao .tit{font-weight:700;margin-bottom:2px}
.balao .cinza{color:var(--suave)}
.marco{font-family:'JetBrains Mono',monospace;font-size:12px}
.cercas-barra{display:none;gap:6px}
.cercas-barra button{width:auto;font-size:13px;padding:7px 12px;background:transparent;
  color:var(--tinta);border-color:var(--linha);font-weight:500}
.cercas-barra button:disabled{opacity:.4;cursor:default}
.dica{font-size:12px;color:var(--suave);max-width:280px}

/* ---- contato com o servidor (CONTEXTO-VTU 2 e 5.4) ----
   O painel fica ligado o dia inteiro ao lado do programador. Uma tela que
   parou de atualizar tem exatamente a mesma cara de uma tela em que nada
   se mexeu — e confundir as duas é o erro mais caro deste painel. Por isso
   a idade do dado é escrita, sempre, e fica amarela quando envelhece. */
.contato{display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;
  font-size:11px;color:var(--suave);white-space:nowrap}
.contato .ponto{width:8px;height:8px;border-radius:50%;background:var(--vivo);flex:none}
.contato.velho{color:var(--morno);font-weight:600}
.contato.velho .ponto{background:var(--morno)}
.contato.perdido{color:var(--frio);font-weight:600}
.contato.perdido .ponto{background:var(--frio)}

/* ---- modo painel de parede ----
   Não é enfeite: a tela é lida de alguns metros, de pé, por quem está no
   meio de outra coisa. O que encolhe (timeline, botões, coordenada) é o que
   ninguém opera a essa distância; o que cresce é o que se lê de longe. */
body.parede .tempo,
body.parede .cercas-barra,
body.parede .dica{display:none}
body.parede #painel.ver{grid-template-columns:400px 1fr;grid-template-rows:auto 1fr auto}
body.parede header{padding:16px 22px}
body.parede header h1{font-size:28px}
body.parede aside{padding:18px}
body.parede .item{padding:14px 12px}
body.parede .item .nome{font-size:22px}
body.parede .item .campo{font-size:16px;margin-top:5px}
body.parede .bola{width:15px;height:15px;margin-top:8px}
body.parede .contato{font-size:14px}
body.parede .detalhe h2{font-size:28px}
body.parede .linha-campo{font-size:17px;padding:10px 0}
body.parede .faixa{font-size:16px}

@media (max-width:760px){
  #painel.ver{grid-template-columns:1fr;grid-template-rows:auto 1fr auto auto}
  aside{border-right:none;border-top:1px solid var(--linha);max-height:40vh;order:4}
  main{order:2}
  .tempo{order:3}
  .tempo .quando{min-width:0;font-size:13px}
}
</style>
</head>
<body>

<div id="acesso">
  <div class="caixa">
    <div class="kicker">Monitor</div>
    <h1 id="ac-titulo">Entrar no grupo</h1>

    <div class="nivel">
      <button id="n-grupo" class="on">GRUPO</button>
      <button id="n-familia">FAMÍLIA</button>
    </div>

    <div class="cartao">
      <label for="i-nome" id="l-nome">Nome do grupo</label>
      <input id="i-nome" type="text" autocapitalize="none" autocomplete="off" placeholder="equipe-campo" />

      <label for="i-senha">Senha</label>
      <input id="i-senha" type="password" autocomplete="current-password" />

      <div class="lembrar">
        <input id="i-lembrar" type="checkbox" checked />
        <label for="i-lembrar" style="margin:0;text-transform:none;font-family:inherit;font-size:14px;letter-spacing:0">Manter conectado neste computador</label>
      </div>

      <button id="b-entrar">Entrar</button>
      <div class="erro" id="erro-acesso"></div>
    </div>
    <p class="rodape" id="ac-nota">
      Use o mesmo grupo e senha cadastrados no aplicativo do celular.
    </p>
  </div>
</div>

<div id="painel">
  <header>
    <div>
      <div class="kicker" id="cab-escopo">—</div>
      <h1 id="cab-titulo">Aguardando dados</h1>
    </div>
    <div class="cabeca-dir">
      <span class="contato" id="contato"><span class="ponto"></span><span id="contato-txt">—</span></span>
      <span class="dica" id="dica-cerca"></span>
      <div class="cercas-barra" id="cercas-barra">
        <button class="fantasma" id="b-nova-cerca">Nova cerca</button>
        <button class="fantasma" id="b-desfazer">Desfazer ponto</button>
        <button class="fantasma" id="b-cancelar">Cancelar</button>
        <button class="fantasma" id="b-salvar">Salvar cerca</button>
      </div>
      <button class="fantasma" id="b-centrar">Ver todos</button>
      <button class="fantasma" id="b-parede">Painel</button>
      <button class="fantasma" id="b-sair">Sair</button>
    </div>
  </header>

  <aside><div id="lista"></div></aside>

  <main><div id="mapa"></div></main>

  <div class="tempo" id="tempo">
    <span class="quando" id="t-quando">—</span>
    <input type="range" id="t-barra" min="0" max="10080" step="1" value="10080" />
    <button class="agora-btn" id="b-agora">Agora</button>
  </div>

  <div class="faixa" id="faixa"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* NUCLEO:INICIO — gerado por rastreio/ferramentas/embutir.js
   Não edite aqui: mexa em src/trilha.js, src/tempo.js, src/paradas.js, src/vinculos.js, src/cercas.js, no repositório do app,
   e rode o script de novo. O que for escrito à mão neste trecho
   se perde na próxima geração. */

/* ---------- src/trilha.js ---------- */

/**
 * Preparo do traçado para desenho. Três correções, nesta ordem:
 *
 *  1. Ordena por "hora" (o relógio da leitura do GPS) e não pela chegada no
 *     banco. Os pontos sobem em lote e dividem o mesmo carimbo de criação —
 *     ordenar por ele embaralha o trecho inteiro e a linha sai em zigue-zague.
 *  2. Tira do desenho as leituras com precisão acima de 50 m. Elas continuam
 *     gravadas: o corte é só visual.
 *  3. Ignora excursão que sai e volta: se o aparelho se afasta e reaparece a
 *     menos de 20 m da âncora em poucos minutos, aquilo foi deriva do GPS e
 *     não vira traço.
 */

const PRECISAO_MAX = 50;               // m
const RAIO_PARADA = 20;                // m
const EXCURSAO_MAX_MS = 5 * 60 * 1000; // os "poucos minutos"
const PASSO_MARCA = 500;               // m entre os marcos da rota

/**
 * A leitura crua, guardada mas fora da geometria (CONTEXTO-VTU 5.6).
 *
 * A regra de gravação só transforma em ponto o que andou 50 m ou o que
 * marcou os 10 min de vida; o resto era descartado e não existia em lugar
 * nenhum. Numa manobra de pátio — poucos metros, muitas paradas — isso
 * apaga justamente o movimento que se quer medir, e depois do teste em
 * campo não há como responder se um limiar menor teria captado. Agora a
 * leitura descartada é gravada com este tipo.
 *
 * Ela NÃO entra em nada que desenhe ou decida: nem no traçado, nem nas
 * paradas, nem no farol. Se entrasse, mudaria a regra que o teste existe
 * para avaliar, e a comparação perderia o sentido. Entra só onde prova que
 * o aparelho estava vivo — sinal e cobertura — porque para isso ela vale
 * tanto quanto qualquer outra.
 */
const TIPO_BRUTO = "bruto";

const eBruto = (p) => p != null && p.tipo === TIPO_BRUTO;

/** Só o que a regra de gravação aprovou: é isto que vira linha e parada. */
function semBrutos(pontos) {
  return (pontos || []).filter((p) => !eBruto(p));
}

const RAIO_TERRA = 6371000;

/** Distância em metros entre duas leituras (haversine). */
function distancia(a, b) {
  const rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad;
  const dLng = (b.lng - a.lng) * rad;
  const s =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * RAIO_TERRA * Math.asin(Math.min(1, Math.sqrt(s)));
}

/**
 * Rumo de a para b, em graus (0 = norte, 90 = leste). Serve para virar a
 * setinha do marco de percurso na direção em que o aparelho seguia: num pátio
 * de manobra, saber se a locomotiva ia ou voltava pelo mesmo trilho é metade
 * da leitura da rota.
 */
function rumoEntre(a, b) {
  const rad = Math.PI / 180;
  const dLng = (b.lng - a.lng) * rad;
  const y = Math.sin(dLng) * Math.cos(b.lat * rad);
  const x =
    Math.cos(a.lat * rad) * Math.sin(b.lat * rad) -
    Math.sin(a.lat * rad) * Math.cos(b.lat * rad) * Math.cos(dLng);
  return (Math.atan2(y, x) * (180 / Math.PI) + 360) % 360;
}

/** Instante da leitura. Só cai no criado_em se "hora" vier vazia. */
function emMs(p) {
  const t = Date.parse(p?.hora ?? "");
  if (!Number.isNaN(t)) return t;
  const c = Date.parse(p?.criado_em ?? "");
  return Number.isNaN(c) ? 0 : c;
}

const valido = (p) =>
  p != null && Number.isFinite(p.lat) && Number.isFinite(p.lng);

/**
 * Ordena pela hora real da leitura. O sort do JS é estável, então leituras
 * com a mesma hora ficam na ordem em que o servidor mandou.
 */
function ordenarPorHora(pontos) {
  return (pontos || []).filter(valido).slice().sort((a, b) => emMs(a) - emMs(b));
}

/**
 * Leituras em condição de dizer alguma coisa sobre geometria: na ordem certa,
 * sem as imprecisas e sem as cruas. Serve tanto ao desenho quanto ao cálculo
 * de paradas — leitura torta inventa movimento que não houve, e leitura crua
 * mudaria a regra dos 50 m por baixo do pano.
 */
function leiturasBoas(pontos, precisaoMax = PRECISAO_MAX) {
  return ordenarPorHora(semBrutos(pontos)).filter(
    (p) => p.precisao == null || p.precisao <= precisaoMax
  );
}

/**
 * Toda leitura que chegou, crua ou não, precisa ou não. É a lista de
 * CONTATOS: cada uma prova que o aparelho estava vivo e falando naquele
 * instante, que é o que sinal (item 3) e cobertura (CONTEXTO-VTU 5.2)
 * precisam saber. Silêncio é ninguém falar, não é falar torto.
 */
function contatos(pontos) {
  return ordenarPorHora(pontos);
}

/**
 * Junta num nó só as leituras consecutivas que ficam dentro do raio de parada.
 * Parado, o GPS não para de mandar ponto — sem isso a linha vira um novelo em
 * cima da casa.
 */
function agrupar(pontos, raioParada) {
  const grupos = [];
  for (const p of pontos) {
    const ultimo = grupos[grupos.length - 1];
    if (ultimo && distancia(ultimo.ancora, p) <= raioParada) {
      ultimo.fim = emMs(p);
    } else {
      grupos.push({ ancora: p, inicio: emMs(p), fim: emMs(p) });
    }
  }
  return grupos;
}

/**
 * Apaga o desvio que volta pra âncora. Se depois de sair o aparelho reaparece
 * a menos de raioParada dela ainda dentro da janela, tudo que houve no meio
 * some e a parada segue contando como uma coisa só.
 */
function removerExcursoes(grupos, raioParada, janelaMs) {
  const saida = [];
  let i = 0;
  while (i < grupos.length) {
    const base = { ...grupos[i] };
    let j = i + 1;
    for (;;) {
      let retorno = -1;
      for (let k = j; k < grupos.length; k++) {
        if (grupos[k].inicio - base.fim > janelaMs) break;
        if (distancia(base.ancora, grupos[k].ancora) <= raioParada) retorno = k;
      }
      if (retorno < 0) break;
      base.fim = grupos[retorno].fim; // a parada continua; o desvio some
      j = retorno + 1;
    }
    saida.push(base);
    i = j;
  }
  return saida;
}

/**
 * Devolve o que o mapa precisa:
 *   trilha — vértices da linha, ordenados, filtrados e sem os desvios
 *   atual  — leitura boa mais recente, que é onde o pin fica
 *
 * A trilha termina na âncora da última parada, não em "atual": entre os dois
 * pode haver até um raio de distância, e é justamente esse resto que faz o
 * traço tremer quando o aparelho está parado.
 */
/**
 * Pontinhos a cada 500 m percorridos ao longo da rota (item 5). Devolve a
 * posição interpolada entre dois vértices, a hora e a distância acumulada —
 * o que aparece ao passar o mouse no site ou tocar no app.
 *
 * Interpola porque o marco quase nunca cai em cima de um vértice: com um
 * ponto a cada 50 m, o de 500 m fica no meio de um trecho.
 */
function comprimentoDaTrilha(trilha) {
  let total = 0;
  for (let i = 1; i < trilha.length; i++) total += distancia(trilha[i - 1], trilha[i]);
  return total;
}

/**
 * O passo de 500 m é grande demais para percurso curto: uma manobra de pátio
 * inteira cabe entre dois marcos, e a rota fica sem nenhum. Rota curta ganha
 * marco mais miúdo, para que sempre haja o que ler ao longo do traço. O teto
 * continua sendo PASSO_MARCA — em viagem longa, marco de 100 em 100 m viraria
 * um colar de contas.
 */
function passoDosMarcos(trilha, passoMax = PASSO_MARCA) {
  const total = comprimentoDaTrilha(trilha);
  if (total < 1000) return 100;
  if (total < 5000) return 250;
  return passoMax;
}

function marcosDeDistancia(trilha, passo) {
  const usado = passo ?? passoDosMarcos(trilha);
  const marcos = [];
  let acumulado = 0;
  let proximo = usado;

  for (let i = 1; i < trilha.length; i++) {
    const d = distancia(trilha[i - 1], trilha[i]);
    while (d > 0 && acumulado + d >= proximo) {
      const fracao = (proximo - acumulado) / d;
      marcos.push({
        lat: trilha[i - 1].lat + (trilha[i].lat - trilha[i - 1].lat) * fracao,
        lng: trilha[i - 1].lng + (trilha[i].lng - trilha[i - 1].lng) * fracao,
        hora: trilha[i].hora,
        metros: proximo,
        // Para onde ia: é o que orienta a setinha do marco no mapa.
        rumo: rumoEntre(trilha[i - 1], trilha[i]),
      });
      proximo += usado;
    }
    acumulado += d;
  }
  return marcos;
}

function prepararTrilha(pontos, opcoes = {}) {
  const {
    precisaoMax = PRECISAO_MAX,
    raioParada = RAIO_PARADA,
    janelaExcursaoMs = EXCURSAO_MAX_MS,
  } = opcoes;

  const ordenados = ordenarPorHora(pontos);
  const bons = leiturasBoas(ordenados, precisaoMax);

  // Se nenhuma leitura passou no corte, o pin não pode sumir: fica na última
  // posição conhecida, mesmo que imprecisa. Só a linha some.
  if (!bons.length) {
    return { trilha: [], atual: ordenados[ordenados.length - 1] || null };
  }

  const limpos = removerExcursoes(
    agrupar(bons, raioParada),
    raioParada,
    janelaExcursaoMs
  );

  return {
    trilha: limpos.map((g) => g.ancora),
    atual: bons[bons.length - 1],
  };
}

/* ---------- src/tempo.js ---------- */

/**
 * Horário local, num lugar só (CONTEXTO-VTU 5.7).
 *
 * O banco grava em UTC, e está certo: UTC não tem horário de verão nem
 * ambiguidade. O problema é a leitura. Um relatório operacional é lido em
 * horário de Brasília, e o turno que vira a meia-noite é onde a diferença
 * deixa de ser detalhe: um ponto das 22h de Vitória cai no DIA SEGUINTE em
 * UTC, e o somatório por dia parte o turno no meio sem avisar ninguém.
 *
 * A armadilha maior não é o UTC, é o `toLocaleString` sem fuso: ele usa o
 * relógio da MÁQUINA que está mostrando. O celular do pátio acerta por
 * acaso; um servidor, um Codespaces ou um painel com o fuso errado mostram
 * outra hora com a mesma cara de certo. Aqui o fuso é escrito, não herdado.
 *
 * Regra prática: nenhum arquivo chama toLocaleString direto. Passa por aqui.
 */

/** O fuso da operação. É de Vitória (ES) que se lê este painel. */
const FUSO = "America/Sao_Paulo";

const nada = "—";
// O nome é comprido de propósito: embutido no site, este arquivo divide o
// escopo global com trilha.js, que já tem um "valido" para ponto do mapa.
const instanteValido = (ms) => ms != null && Number.isFinite(Number(ms));

/** Aceita tanto milissegundos quanto o texto ISO que o servidor devolve. */
function paraMs(valor) {
  if (valor == null) return null;
  if (typeof valor === "number") return Number.isFinite(valor) ? valor : null;
  const t = Date.parse(valor);
  return Number.isNaN(t) ? null : t;
}

/** "14:32" */
function horaLocal(valor) {
  const ms = paraMs(valor);
  if (!instanteValido(ms)) return nada;
  return new Date(ms).toLocaleTimeString("pt-BR", {
    hour: "2-digit", minute: "2-digit", timeZone: FUSO,
  });
}

/** "07/08" — dia e mês, para quando o ano é óbvio pelo contexto. */
function diaCurto(valor) {
  const ms = paraMs(valor);
  if (!instanteValido(ms)) return nada;
  return new Date(ms).toLocaleDateString("pt-BR", {
    day: "2-digit", month: "2-digit", timeZone: FUSO,
  });
}

/** "qua, 07/08 14:32" — o rótulo da timeline. */
function dataHoraLocal(valor) {
  const ms = paraMs(valor);
  if (!instanteValido(ms)) return nada;
  return new Date(ms).toLocaleString("pt-BR", {
    weekday: "short", day: "2-digit", month: "2-digit",
    hour: "2-digit", minute: "2-digit", timeZone: FUSO,
  });
}

/**
 * O horário de um instante que pode NÃO ser de hoje.
 *
 *   hoje    → "14:32"
 *   ontem   → "ontem 14:32"
 *   antes   → "sáb, 08/08 14:32"
 *
 * Existe por causa de um problema real, relatado em 10/08/2026: a tela dizia
 * "parou 8:51" e não havia como saber se era daquela manhã, da véspera ou de
 * dois dias antes. Num aparelho que parou de dar notícia, essa é justamente a
 * pergunta — e a resposta some exatamente quando mais importa, porque quanto
 * mais velho o dado, mais ambíguo fica o "8:51".
 *
 * Escrever a data sempre resolveria e custaria caro: a maior parte do que o
 * painel mostra é de agora, e "seg, 10/08 14:32" repetido em toda linha vira
 * ruído que se aprende a não ler. Então a data só aparece quando muda a
 * resposta — que é quando o instante não é de hoje.
 *
 * `agora` entra por parâmetro para o teste poder fixar o presente; sem isso
 * a prova passaria hoje e falharia amanhã.
 */
function momentoLocal(valor, agora = Date.now()) {
  const ms = paraMs(valor);
  if (!instanteValido(ms)) return nada;

  // Compara o DIA escrito ("2026-08-10"), não um instante calculado.
  //
  // A primeira versão comparava inicioDoDiaLocal() dos dois lados, e isso
  // falhou no aparelho enquanto passava nos testes: aquela conta depende de
  // reler um texto de data com `new Date(...)`, e o motor do Android
  // (Hermes) não interpreta igual ao Node. Vinha NaN, `NaN === NaN` é
  // falso, e TODA data saía por extenso — inclusive a de hoje.
  //
  // Relatado em campo em 10/08/2026, no mesmo print que provou o rastreio
  // em segundo plano funcionando. Lição para o projeto inteiro: a prova
  // roda no Node e o app roda no Hermes, então conta que depende de
  // interpretar texto de data não é coberta por teste nenhum daqui.
  const dia = diaLocal(ms);
  const hoje = diaLocal(agora);
  if (!dia || !hoje) return dataHoraLocal(ms);

  if (dia === hoje) return horaLocal(ms);

  // Ontem, calculado sobre o próprio texto do dia: meio-dia UTC é longe o
  // bastante das bordas para o horário de verão não empurrar a data para o
  // dia errado.
  const ontem = new Date(Date.parse(hoje + "T12:00:00Z") - 86400000)
    .toISOString()
    .slice(0, 10);
  if (dia === ontem) return "ontem " + horaLocal(ms);

  return dataHoraLocal(ms);
}

/** "07/08/2026 14:32" — o carimbo completo, para exportação e conferência. */
function carimboLocal(valor) {
  const ms = paraMs(valor);
  if (!instanteValido(ms)) return nada;
  return new Date(ms).toLocaleString("pt-BR", {
    day: "2-digit", month: "2-digit", year: "numeric",
    hour: "2-digit", minute: "2-digit", second: "2-digit", timeZone: FUSO,
  });
}

/**
 * A chave de agrupamento por dia: "2026-08-07", já no fuso da operação.
 *
 * O truque do locale "en-CA" é o jeito curto de pedir ano-mês-dia com zero à
 * esquerda; o que importa mesmo é o timeZone, que faz 07/08 23h30 de Vitória
 * continuar sendo 07/08 e não virar 08/08. Ordena como texto, o que é
 * conveniente: agrupar e ordenar por dia viram a mesma coisa.
 */
function diaLocal(valor) {
  const ms = paraMs(valor);
  if (!instanteValido(ms)) return null;
  // Montado peça por peça, e não por formato de locale: "en-CA" devolve
  // AAAA-MM-DD no navegador e no Node, mas o motor do Android (Hermes) não
  // garante o mesmo. formatToParts é a única forma que devolve as peças
  // nomeadas, sem depender de como cada motor escreve a data.
  const partes = new Intl.DateTimeFormat("en-US", {
    timeZone: FUSO, year: "numeric", month: "2-digit", day: "2-digit",
  }).formatToParts(new Date(ms));
  const p = {};
  for (const parte of partes) p[parte.type] = parte.value;
  if (!p.year || !p.month || !p.day) return null;
  return `${p.year}-${p.month}-${p.day}`;
}

/**
 * O começo do dia local, em milissegundos. Serve para recortar "o turno de
 * hoje" sem depender do relógio de quem está olhando.
 *
 * Feito por diferença medida, não por soma de fuso fixo: o deslocamento do
 * Brasil já mudou por decreto antes e pode mudar de novo, e uma constante
 * de -3h envelheceria calada.
 */
function inicioDoDiaLocal(valor) {
  const ms = paraMs(valor) ?? Date.now();
  const dia = diaLocal(ms);
  if (!dia) return null;
  // Meia-noite daquele dia, primeiro lida como se fosse UTC...
  const comoUtc = Date.parse(dia + "T00:00:00Z");
  // ...e depois corrigida pelo quanto o fuso local estava deslocado ali.
  return comoUtc + deslocamentoMs(comoUtc);
}

/**
 * Quanto o fuso da operação está atrás/à frente do UTC naquele instante.
 *
 * A versão anterior fazia `new Date(d.toLocaleString("en-US", …))` — ou
 * seja, escrevia a data como texto e mandava o motor reler. Funciona no
 * Node e no navegador; **no Hermes, que é o motor do app Android, não é
 * garantido**, e o resultado vira NaN em silêncio. Como NaN contamina toda
 * conta que toca nele, `inicioDoDiaLocal` passava a devolver NaN e tudo o
 * que depende dele (cobertura, começo de turno, agrupamento por dia) errava
 * sem dar erro.
 *
 * Descoberto em 10/08/2026 pelo sintoma visível — toda data saindo por
 * extenso na tela — mas o estrago silencioso era maior que o visível.
 *
 * Agora as peças da data vêm nomeadas por formatToParts e são remontadas em
 * ISO, que é o único formato que TODO motor de JavaScript é obrigado a
 * interpretar igual.
 */
function deslocamentoMs(ms) {
  const partes = new Intl.DateTimeFormat("en-US", {
    timeZone: FUSO,
    hour12: false,
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit",
  }).formatToParts(new Date(ms));

  const p = {};
  for (const parte of partes) p[parte.type] = parte.value;
  // Meia-noite sai como "24" em alguns motores; em ISO isso não existe.
  const hora = p.hour === "24" ? "00" : p.hour;

  const comoUtc = Date.parse(
    `${p.year}-${p.month}-${p.day}T${hora}:${p.minute}:${p.second}Z`
  );
  if (Number.isNaN(comoUtc)) return 0;
  // Os milissegundos não entram na remontagem; arredondar evita um segundo
  // de sobra virar diferença de fuso.
  return Math.round((ms - comoUtc) / 1000) * 1000;
}

/* ---------- src/paradas.js ---------- */

/**
 * Estado do ativo a partir dos pontos: parado ou em movimento, há quanto
 * tempo, com que sinal. É o que alimenta o farol, o ícone de ondas e os
 * campos da lista (CLAUDE.md itens 3, 4 e 8).
 *
 * Nada aqui sabe desenhar. O monitor do app e o site consomem as mesmas
 * funções e só escolhem como mostrar.
 *
 * Farol (item 4) — tempo parado no mesmo lugar, limites iguais para todo
 * lugar: verde até 15 min, amarelo de 15 a 25, vermelho acima de 25, azul
 * em movimento.
 *
 * Sinal (item 3) — tempo desde a última notícia: cheio até 12 min, uma barra
 * de 12 a 15, onda cortada acima de 15. Sem sinal o pin não some; fica
 * esmaecido na última posição conhecida.
 */


const MOVIMENTO_SUSTENTADO_MS = 60 * 1000; // item 4: 60 s fora do raio
const FAROL_AMARELO_MIN = 15;
const FAROL_VERMELHO_MIN = 25;
const SINAL_FRACO_MIN = 12;
const SINAL_MUDO_MIN = 15;

/**
 * Quebra o histórico em trechos de parada e de movimento.
 *
 * A máquina tem dois estados. Parado, guarda a âncora: leitura que cai dentro
 * do raio só estica a parada. Leitura fora abre uma suspeita de saída, e a
 * saída só vira movimento se durar mais de 60 s — assim a deriva que sai e
 * volta não parte a parada em duas. Em movimento, o aparelho assenta quando
 * duas leituras seguidas caem dentro do raio uma da outra; a parada nova é
 * ancorada na primeira delas, que é quando ele chegou.
 *
 * Devolve trechos { tipo, inicio, fim, ancora? } em ordem cronológica.
 *
 * "agora" existe por causa da saída que ainda não foi confirmada por uma
 * segunda leitura: se o aparelho apareceu fora do raio e o tempo passou sem
 * ele voltar, a saída se confirma pelo relógio, não por um ponto novo. Sem
 * isso, quem sai e perde o sinal na esquina continua "parado em casa".
 */
function calcularTrechos(pontos, opcoes = {}) {
  const {
    raio = RAIO_PARADA,
    movimentoSustentadoMs = MOVIMENTO_SUSTENTADO_MS,
    precisaoMax,
    agora,
  } = opcoes;

  const ps = leiturasBoas(pontos, precisaoMax);
  if (!ps.length) return [];
  const relogio = agora ?? emMs(ps[ps.length - 1]);

  const trechos = [];
  let parada = { ancora: ps[0], inicio: emMs(ps[0]), fim: emMs(ps[0]) };
  let movimento = null;   // { inicio, anterior }
  let suspeita = null;    // primeira leitura fora do raio, ainda não confirmada

  for (let i = 1; i < ps.length; i++) {
    const p = ps[i];
    const t = emMs(p);

    if (parada) {
      if (distancia(parada.ancora, p) <= raio) {
        parada.fim = t;      // continua parado
        suspeita = null;     // se havia saída em curso, foi excursão: esquece
        continue;
      }
      if (!suspeita) suspeita = { desde: t };
      if (t - suspeita.desde <= movimentoSustentadoMs) continue;

      // fora do raio por mais de 60 s: saiu mesmo
      trechos.push({ ...parada, tipo: "parada" });
      movimento = { inicio: parada.fim, anterior: p };
      parada = null;
      suspeita = null;
      continue;
    }

    // em movimento: assentou?
    if (distancia(movimento.anterior, p) <= raio) {
      const chegada = emMs(movimento.anterior);
      trechos.push({ tipo: "movimento", inicio: movimento.inicio, fim: chegada });
      parada = { ancora: movimento.anterior, inicio: chegada, fim: t };
      movimento = null;
    } else {
      movimento.anterior = p;
    }
  }

  if (!parada) {
    trechos.push({ tipo: "movimento", inicio: movimento.inicio, fim: emMs(movimento.anterior) });
    return trechos;
  }

  trechos.push({ ...parada, tipo: "parada" });
  // Saiu do raio e o tempo passou sem voltar: a saída se confirma sozinha.
  if (suspeita && relogio - suspeita.desde > movimentoSustentadoMs) {
    trechos.push({
      tipo: "movimento",
      inicio: parada.fim,
      fim: emMs(ps[ps.length - 1]),
    });
  }
  return trechos;
}

/**
 * Os buracos de contato ao longo do histórico (item 3, mesmo prazo do sinal).
 *
 * Existe porque a linha da rota mente por omissão: dois pontos ligados por um
 * traço reto têm a mesma aparência quer estejam separados por um minuto ou por
 * duas horas. Sem marcar o buraco, um trecho em que o aparelho sumiu vira
 * "passou por aqui" no mapa, e ninguém tem como saber que aquilo é chute.
 *
 * Conta com TODA leitura que chegou, não só as boas: leitura torta é imprecisa,
 * mas prova que o aparelho estava vivo e falando. Silêncio é ninguém falar.
 *
 * A posição do marco é o meio do caminho entre a última notícia e a primeira
 * depois dela — que é, literalmente, onde não se sabe o que houve.
 */
function trechosDeSilencio(pontos, opcoes = {}) {
  const { silencioMs = SINAL_MUDO_MIN * 60000 } = opcoes;
  const ps = ordenarPorHora(pontos);
  const buracos = [];

  for (let i = 1; i < ps.length; i++) {
    const inicio = emMs(ps[i - 1]);
    const fim = emMs(ps[i]);
    if (fim - inicio < silencioMs) continue;
    buracos.push({
      tipo: "silencio",
      inicio,
      fim,
      duracaoMs: fim - inicio,
      de: { lat: ps[i - 1].lat, lng: ps[i - 1].lng },
      para: { lat: ps[i].lat, lng: ps[i].lng },
      lat: (ps[i - 1].lat + ps[i].lat) / 2,
      lng: (ps[i - 1].lng + ps[i].lng) / 2,
      // Quanto o aparelho andou enquanto ninguém via. Distância grande com
      // silêncio longo é o caso em que o traço reto mais engana.
      metros: distancia(ps[i - 1], ps[i]),
    });
  }
  return buracos;
}

function farolDe(paradoMin, emMovimento) {
  if (emMovimento) return "azul";
  if (paradoMin < FAROL_AMARELO_MIN) return "verde";
  if (paradoMin <= FAROL_VERMELHO_MIN) return "amarelo";
  return "vermelho";
}

/**
 * Sinal pelo tempo desde a última notícia. "barras" existe para o ícone de
 * ondas: 3 é a onda cheia, 1 é a onda com um traço, 0 é a onda cortada.
 */
function calcularSinal(ultimaMs, agora = Date.now()) {
  if (!ultimaMs) return { nivel: "sem", barras: 0, minutos: null, mudo: true };
  const minutos = (agora - ultimaMs) / 60000;
  if (minutos < SINAL_FRACO_MIN) return { nivel: "cheio", barras: 3, minutos, mudo: false };
  if (minutos <= SINAL_MUDO_MIN) return { nivel: "fraco", barras: 1, minutos, mudo: false };
  return { nivel: "sem", barras: 0, minutos, mudo: true };
}

/**
 * O retrato de um ativo num instante. Passando "agora" no passado, devolve o
 * que valia naquele momento — é o que a timeline (item 6) vai pedir, com
 * todos os pins voltando juntos.
 */
function estadoAtual(pontos, agora = Date.now(), opcoes = {}) {
  const ps = leiturasBoas(pontos, opcoes.precisaoMax).filter((p) => emMs(p) <= agora);
  const todas = contatos(pontos).filter((p) => emMs(p) <= agora);
  const ultimaConhecida = todas.length ? todas[todas.length - 1] : null;

  // O sinal mede CONTATO, não geometria: vale toda leitura que chegou, mesmo
  // a torta e mesmo a crua. Uma leitura imprecisa não serve para dizer onde o
  // aparelho está, mas prova que ele estava vivo e falando — e é isso que a
  // pergunta "tem sinal?" quer saber. Medir o sinal só pelas leituras boas
  // fazia um aparelho falante porém impreciso aparecer como mudo, e nesta
  // operação silêncio é gatilho de verificação (CONTEXTO-VTU 2).
  const ultimoContatoMs = ultimaConhecida ? emMs(ultimaConhecida) : null;
  const sinal = calcularSinal(ultimoContatoMs, agora);

  if (!ps.length) {
    // Sem leitura boa o pin ainda tem de aparecer, na última posição conhecida.
    return {
      posicao: ultimaConhecida,
      ultimaPosicao: ultimaConhecida,
      ultimoContatoMs,
      emMovimento: false,
      desde: null,
      paradoMs: null,
      farol: "verde",
      sinal,
      trechos: [],
    };
  }

  const trechos = calcularTrechos(ps, { ...opcoes, agora });
  const ultimo = trechos[trechos.length - 1];

  // Sem notícia há tempo demais (item 3), não dá para seguir afirmando "em
  // movimento" só porque o relógio passou do prazo de 60 s: essa inferência
  // vale para quem saiu e ainda dá notícia, não para quem sumiu de vez. Sem
  // sinal, cai nas regras normais de parado (item 4), contando desde a
  // última posição que se tem de fato.
  const emMovimento = ultimo.tipo === "movimento" && !sinal.mudo;
  const desde = emMovimento ? ultimo.inicio : (sinal.mudo ? emMs(ps[ps.length - 1]) : ultimo.inicio);
  const paradoMs = emMovimento ? null : agora - desde;

  return {
    // Parado, o pin fica na âncora: é o lugar, não a última tremida do GPS.
    // Sem âncora (trecho de movimento que virou "sem sinal"), fica na
    // última posição conhecida.
    posicao: emMovimento ? ps[ps.length - 1] : (ultimo.ancora || ps[ps.length - 1]),
    // A última posição de fato lida, sem âncora nem arredondamento. É o que
    // o painel mostra com hora ao lado, para ninguém confundir mapa parado
    // no tempo com locomotiva parada no pátio (CONTEXTO-VTU 5.3).
    ultimaPosicao: ultimaConhecida,
    ultimoContatoMs,
    emMovimento,
    desde,
    paradoMs,
    farol: farolDe(paradoMs / 60000, emMovimento),
    sinal,
    trechos,
  };
}

/**
 * Cobertura do rastreio no período (CONTEXTO-VTU 5.2).
 *
 * Existe porque todo número que sair daqui vai ser questionado, e "a loco
 * ficou 3h40 parada" só se sustenta se der para responder se o rastreio
 * estava vivo essas 3h40 inteiras. Sem denominador, silêncio vira "parado" e
 * infla o total a favor de quem cobra — o que destrói a credibilidade na
 * primeira contestação, que é pior do que não ter o número.
 *
 * A conta: o período é coberto onde duas notícias seguidas estão a menos de
 * SINAL_MUDO_MIN uma da outra. Qualquer intervalo maior é buraco, e o buraco
 * conta inteiro, não descontado do prazo — os 15 min são o limiar para
 * chamar de buraco, não uma franquia de silêncio que sai de graça.
 *
 * Vale toda leitura, inclusive a crua e a imprecisa: o que se mede aqui é o
 * rastreio estar vivo, não a qualidade da posição.
 *
 * Uma nota de honestidade que o painel precisa repetir: o buffer local faz o
 * ponto subir atrasado, com a hora certa. Então a cobertura de um período
 * recente pode melhorar sozinha quando o aparelho reencontra internet. Ela é
 * definitiva para o passado, provisória para a última hora.
 */
function cobertura(pontos, inicio, fim, opcoes = {}) {
  const { silencioMs = SINAL_MUDO_MIN * 60000 } = opcoes;
  const janelaMs = Math.max(0, (fim ?? 0) - (inicio ?? 0));
  const vazio = {
    janelaMs, cobertoMs: 0, mudoMs: janelaMs,
    percentual: janelaMs ? 0 : null, buracos: [],
  };
  if (!janelaMs) return { ...vazio, mudoMs: 0 };

  const marcos = contatos(pontos).map(emMs).filter(Number.isFinite);
  const anteriores = marcos.filter((t) => t < inicio);
  const dentro = marcos.filter((t) => t >= inicio && t <= fim);

  const buracos = [];
  let mudoMs = 0;
  const marcar = (de, ate) => {
    const a = Math.max(de, inicio);
    const b = Math.min(ate, fim);
    if (b <= a) return;
    mudoMs += b - a;
    buracos.push({ inicio: a, fim: b, duracaoMs: b - a });
  };

  // A última notícia ANTES da janela conta: um turno que começa 3 min depois
  // do último ponto do turno anterior começa coberto, não no escuro.
  let anterior = anteriores.length ? anteriores[anteriores.length - 1] : null;

  for (const t of dentro) {
    if (anterior == null) {
      if (t - inicio > silencioMs) marcar(inicio, t);
    } else if (t - anterior > silencioMs) {
      marcar(anterior, t);
    }
    anterior = t;
  }

  if (anterior == null) marcar(inicio, fim);
  else if (fim - anterior > silencioMs) marcar(anterior, fim);

  const cobertoMs = Math.max(0, janelaMs - mudoMs);
  return {
    janelaMs,
    cobertoMs,
    mudoMs,
    percentual: (cobertoMs / janelaMs) * 100,
    buracos,
  };
}

/** "94% do período" — como a cobertura aparece ao lado de um total. */
function textoCobertura(c) {
  if (!c || c.percentual == null) return "—";
  return Math.round(c.percentual) + "% do período";
}

/** "2h07", "14min", "45s" — o formato que aparece no status e nos balões. */
function duracao(ms) {
  if (ms == null || !Number.isFinite(ms) || ms < 0) return "—";
  const s = Math.floor(ms / 1000);
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "min";
  return Math.floor(m / 60) + "h" + String(m % 60).padStart(2, "0");
}

/**
 * Texto do campo Status (item 8). Sem a palavra "atraso": a urgência é
 * comunicada pela cor do farol, não pela frase.
 */
function textoStatus(estado) {
  if (!estado || !estado.posicao) return "Sem dados";
  if (estado.sinal && estado.sinal.mudo) {
    return "Sem sinal há " + duracao(estado.sinal.minutos * 60000);
  }
  if (estado.emMovimento) return "Em Deslocamento";
  return "Parado há " + duracao(estado.paradoMs);
}

/** Coordenada como nome de lugar, quando não há cerca que o batize. */
const coordenada = (p) =>
  p ? `${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}` : "—";

/**
 * Somatório por lugar no período (item 8). "nomear" recebe a âncora e devolve
 * o nome do lugar — é por aí que as cercas (item 7) entram depois, sem que
 * este arquivo precise saber que elas existem.
 */
function resumoPorLugar(trechos, nomear = coordenada) {
  const lugares = new Map();
  for (const t of trechos) {
    if (t.tipo !== "parada") continue;
    const nome = nomear(t.ancora);
    const atual = lugares.get(nome) || { lugar: nome, total: 0, visitas: 0, ancora: t.ancora };
    atual.total += t.fim - t.inicio;
    atual.visitas += 1;
    lugares.set(nome, atual);
  }
  return [...lugares.values()].sort((a, b) => b.total - a.total);

/* ---------- src/vinculos.js ---------- */

/**
 * Identidade do ativo: qual locomotiva estava neste celular, e quando
 * (CONTEXTO-VTU 5.1).
 *
 * No pátio ninguém pergunta onde está o celular — perguntam onde está a
 * locomotiva, pelo prefixo. Mas o celular troca de máquina: o mesmo aparelho
 * pode ir para outra loco na semana seguinte. Se o prefixo fosse um campo
 * que se sobrescreve, o histórico antigo passaria a mentir sobre qual
 * máquina fez aquele percurso — e um histórico que mente é pior do que
 * nenhum, porque ninguém sabe qual pedaço acreditar.
 *
 * Por isso o vínculo tem vigência: vale de um instante até outro, e o
 * passado fica congelado. Perguntar "de quem era este ponto?" é perguntar
 * pelo instante do ponto, nunca pelo vínculo de agora.
 *
 * Formato que vem do servidor:
 *   { id, grupo, dispositivo, prefixo, de, ate }   ate = null → ainda vale
 */


/** Todos os vínculos daquele aparelho, do mais novo para o mais velho. */
function vinculosDe(vinculos, grupo, dispositivo) {
  return (vinculos || [])
    .filter(
      (v) =>
        v &&
        v.dispositivo === dispositivo &&
        (grupo == null || v.grupo == null || v.grupo === grupo)
    )
    .slice()
    .sort((a, b) => (paraMs(b.de) ?? 0) - (paraMs(a.de) ?? 0));
}

/**
 * O vínculo que valia naquele instante. Como a lista vem do mais novo para o
 * mais velho, o primeiro que couber é o certo: vínculos da mesma máquina não
 * se sobrepõem (quem abre um novo fecha o anterior, no banco).
 */
function vinculoEm(vinculos, grupo, dispositivo, ms = Date.now()) {
  const quando = paraMs(ms) ?? Date.now();
  for (const v of vinculosDe(vinculos, grupo, dispositivo)) {
    const de = paraMs(v.de);
    const ate = paraMs(v.ate);
    if (de != null && quando < de) continue;
    if (ate != null && quando >= ate) continue;
    return v;
  }
  return null;
}

/** O prefixo da loco naquele instante, ou null se não havia vínculo. */
function prefixoEm(vinculos, grupo, dispositivo, ms = Date.now()) {
  const v = vinculoEm(vinculos, grupo, dispositivo, ms);
  return v ? v.prefixo : null;
}

/**
 * O que aparece na tela como nome do ativo: o prefixo da loco, e o nome do
 * aparelho só enquanto não houver loco vinculada. A tela nunca inventa um
 * prefixo — sem vínculo, ela diz o que sabe, que é o nome do celular.
 */
function rotuloAtivo(vinculos, grupo, dispositivo, ms = Date.now()) {
  return prefixoEm(vinculos, grupo, dispositivo, ms) || dispositivo;
}

/** Se o rótulo é a loco de verdade ou o nome do celular servindo de quebra-galho. */
const temLoco = (vinculos, grupo, dispositivo, ms = Date.now()) =>
  prefixoEm(vinculos, grupo, dispositivo, ms) != null;

/**
 * Vínculo aberto de um prefixo em qualquer aparelho. Serve para avisar antes
 * de criar: a mesma loco vinculada a dois celulares ao mesmo tempo faria dois
 * pins com o mesmo nome, e o painel não teria como dizer qual acreditar.
 */
function abertoDoPrefixo(vinculos, prefixo) {
  const alvo = String(prefixo || "").trim().toLowerCase();
  if (!alvo) return null;
  return (
    (vinculos || []).find(
      (v) =>
        v &&
        v.ate == null &&
        String(v.prefixo || "").trim().toLowerCase() === alvo
    ) || null
  );
}

/* ---------- src/cercas.js ---------- */

/**
 * Cercas (CLAUDE.md item 7). Um polígono livre, desenhado ponto a ponto,
 * serve para uma coisa só: dar nome ao lugar. "Parado na Casa há 2h07" em
 * vez de "parado em -20.31550, -40.31280".
 *
 * O que a cerca NÃO faz:
 *  - não mexe no farol, que continua contando os 20 m da âncora;
 *  - não filtra nada do traçado;
 *  - não muda o que é gravado no celular.
 *
 * Ela entra só na hora de escrever o nome do lugar, e por isso este arquivo
 * não conhece mapa, tela nem banco: recebe o ponto e a lista de cercas, e
 * devolve texto.
 *
 * A cerca pertence à família e vale para todos os grupos dela — quem carrega
 * a lista é quem sabe disso; aqui elas chegam prontas.
 */


/**
 * Ponto dentro do polígono, pelo método do raio: conta quantas arestas uma
 * linha para o lado cruza. Ímpar é dentro, par é fora. Funciona com polígono
 * de qualquer formato, inclusive côncavo — que é o caso de um pátio ou de um
 * quarteirão desenhado à mão.
 *
 * Em distâncias de bairro a curvatura da Terra não muda o resultado, então
 * lat/lng entram como se fossem x e y.
 */
function dentroDaCerca(p, cerca) {
  const v = cerca && cerca.pontos;
  if (!p || !Array.isArray(v) || v.length < 3) return false;

  let dentro = false;
  for (let i = 0, j = v.length - 1; i < v.length; j = i++) {
    const latI = v[i].lat, lngI = v[i].lng;
    const latJ = v[j].lat, lngJ = v[j].lng;
    const cruza =
      latI > p.lat !== latJ > p.lat &&
      p.lng < ((lngJ - lngI) * (p.lat - latI)) / (latJ - latI) + lngI;
    if (cruza) dentro = !dentro;
  }
  return dentro;
}

/** Quantos metros vale um grau de latitude. Longitude encolhe com o cosseno. */
const GRAU_EM_METROS = 111320;

/**
 * Área do polígono, pela fórmula do laço de sapato. Serve só para comparar
 * cercas entre si, então a aproximação basta: corrigir a longitude pelo
 * cosseno da latitude média já dá conta, e no tamanho de um pátio ou de um
 * quarteirão o erro não chega perto de trocar a ordem de duas cercas.
 *
 * Polígono inválido devolve Infinity, para nunca ganhar de um válido.
 */
function area(cerca) {
  const v = cerca && cerca.pontos;
  if (!Array.isArray(v) || v.length < 3) return Infinity;

  const latMedia = v.reduce((s, p) => s + p.lat, 0) / v.length;
  const escala = Math.cos((latMedia * Math.PI) / 180);

  let soma = 0;
  for (let i = 0, j = v.length - 1; i < v.length; j = i++) {
    soma += v[j].lng * escala * v[i].lat - v[i].lng * escala * v[j].lat;
  }
  return Math.abs(soma / 2) * GRAU_EM_METROS * GRAU_EM_METROS;
}

/**
 * A cerca que contém o ponto, ou null.
 *
 * Havendo mais de uma — um pátio com a oficina desenhada dentro dele —, vale
 * a MENOR. É ela que descreve melhor onde o aparelho está: "na Oficina" diz
 * mais que "no Pátio". Ordem da lista não influencia.
 */
function cercaDe(p, cercas) {
  if (!p || !cercas || !cercas.length) return null;

  let escolhida = null;
  let menor = Infinity;
  for (const c of cercas) {
    if (!dentroDaCerca(p, c)) continue;
    const a = area(c);
    if (a < menor) {
      menor = a;
      escolhida = c;
    }
  }
  return escolhida;
}

/**
 * O nome do lugar: a cerca, se o ponto estiver dentro de alguma; a coordenada,
 * se não estiver. É a única função que a lista, os balões e o histórico
 * precisam chamar.
 */
function nomearLugar(p, cercas) {
  const c = cercaDe(p, cercas);
  return c ? c.nome : coordenada(p);
}

/**
 * Fecha o polígono para desenho: repete o primeiro ponto no fim. O Leaflet
 * fecha sozinho, mas quem escreve o traço enquanto a pessoa clica precisa
 * disso explícito.
 */
const fechar = (pontos) =>
  pontos.length > 2 ? pontos.concat([pontos[0]]) : pontos;

/**
 * Uma cerca só vale com três vértices. Com dois, é uma linha e não tem
 * dentro; o servidor recusa, mas a tela avisa antes de tentar.
 */
function validar(nome, pontos) {
  if (!nome || !nome.trim()) return "Dê um nome à cerca.";
  if (!pontos || pontos.length < 3) return "A cerca precisa de pelo menos três pontos.";
  return null;
}

    '<div class="tit">' + escapar(rotuloDe(chave)) + "</div>" +
    "<div>" + escapar(textoStatus(estado)) + "</div>" +
    '<div class="cinza">' + ondas(s.barras) + " " + escapar(sinalTxt) + "</div>" +
    '<div class="cinza">' + escapar(lugarDe(estado.posicao)) + "</div>" +
    // A hora da última leitura vem sempre junto, não só quando falta sinal:
    // é ela que separa "mapa desatualizado" de "loco parada de verdade".
    '<div class="cinza">última posição ' + escapar(relogioMs(estado.ultimoContatoMs)) + "</div>" +
    "</div>";
}

function escapar(t) {
  return String(t == null ? "" : t).replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

/* ---------------- acesso ---------------- */

function trocarNivel(n) {
  nivel = n;
  el("n-grupo").className = n === "grupo" ? "on" : "";
  el("n-familia").className = n === "familia" ? "on" : "";
  el("ac-titulo").textContent = n === "familia" ? "Entrar na família" : "Entrar no grupo";
  el("l-nome").textContent = n === "familia" ? "Nome da família" : "Nome do grupo";
  el("i-nome").placeholder = n === "familia" ? "operacao-sul" : "equipe-campo";
  el("ac-nota").textContent = n === "familia"
    ? "A família reúne vários grupos. Você acompanha todos os aparelhos de todos os grupos ligados a ela."
    : "Use o mesmo grupo e senha cadastrados no aplicativo do celular.";
  el("erro-acesso").textContent = "";
}
el("n-grupo").onclick = () => trocarNivel("grupo");
el("n-familia").onclick = () => trocarNivel("familia");

el("b-entrar").onclick = async () => {
  const nome = el("i-nome").value.trim();
  const senha = el("i-senha").value;
  el("erro-acesso").textContent = "";
  if (!nome || !senha) { el("erro-acesso").textContent = "Preencha o nome e a senha."; return; }
  el("b-entrar").disabled = true;
  el("b-entrar").textContent = "Verificando…";
  try {
    await rpc(nivel === "familia" ? "entrar_familia" : "entrar_grupo",
      { p_nome: nome, p_senha: senha });
    acesso = { tipo: nivel, nome: nome.toLowerCase(), senha: senha };
    if (el("i-lembrar").checked) guardar(acesso);
    abrirPainel();
  } catch (e) {
    el("erro-acesso").textContent = e.message;
  }
  el("b-entrar").disabled = false;
  el("b-entrar").textContent = "Entrar";
};

el("i-senha").addEventListener("keydown", (e) => { if (e.key === "Enter") el("b-entrar").click(); });
el("b-sair").onclick = () => { esquecer(); location.reload(); };

/* ---------------- painel ---------------- */

function abrirPainel() {
  el("acesso").style.display = "none";
  el("painel").classList.add("ver");
  el("cab-escopo").textContent =
    (acesso.tipo === "familia" ? "FAMÍLIA " : "GRUPO ") + acesso.nome.toUpperCase();

  iniciarMapa();
  iniciarTimeline();
  prepararModoParede();
  buscar();
  setInterval(buscar, INTERVALO_MS);

  /* O navegador do celular CONGELA os temporizadores da aba que vai para
     segundo plano — trocar de aplicativo basta. Quando a aba volta, o
     intervalo de 15 s pode ter passado minutos sem disparar, e a tela fica
     mostrando a última busca de antes da troca, com cara de atual.

     Relatado em campo em 10/08/2026: o site marcava 10:56 às 11:12, com o
     celular já tendo enviado tudo (fila de envio zerada). O dono tinha
     notado o efeito e atribuído à aba Monitor do app; era a volta ao
     navegador que descongelava a busca.

     Buscar assim que a aba reaparece custa uma requisição e devolve o
     painel ao presente na hora, em vez de esperar o próximo intervalo. */
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") buscar();
  });
  setInterval(pintarTudo, 30000);        // o tempo passa mesmo sem ponto novo
  setInterval(atualizarContato, 5000);   // e a idade do dado corre mais rápido
}

function iniciarMapa() {
  mapa = L.map("mapa").setView([-20.3155, -40.3128], 12);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: "&copy; OpenStreetMap"
  }).addTo(mapa);
  camadaCercas = L.layerGroup().addTo(mapa);
  camadaRota = L.layerGroup().addTo(mapa);
  mapa.on("click", (e) => {
    if (!desenhando) return;
    desenhando.push({ lat: e.latlng.lat, lng: e.latlng.lng });
    desenharCercas();
    atualizarBarraCerca();
  });
  el("b-centrar").onclick = () => { selecionado = null; enquadrado = false; pintarTudo(); };
  prepararBotoesDeCerca();
}

/* ---- desenhar cerca ponto a ponto, só para quem entra como família ---- */

function prepararBotoesDeCerca() {
  const barra = el("cercas-barra");
  barra.style.display = podeEditarCercas() ? "flex" : "none";
  if (!podeEditarCercas()) return;

  el("b-nova-cerca").onclick = () => {
    desenhando = [];
    atualizarBarraCerca();
    desenharCercas();
  };
  el("b-desfazer").onclick = () => {
    if (desenhando) desenhando.pop();
    desenharCercas();
    atualizarBarraCerca();
  };
  el("b-cancelar").onclick = () => {
    desenhando = null;
    atualizarBarraCerca();
    desenharCercas();
  };
  el("b-salvar").onclick = async () => {
    const nome = (prompt("Nome do lugar (é o que vai aparecer no lugar da coordenada):") || "").trim();
    const problema = validar(nome, desenhando);
    if (problema) { faixa(problema); return; }
    try {
      await salvarCerca(nome, desenhando);
      desenhando = null;
      cercas = await carregarCercas();
      faixa(null);
      atualizarBarraCerca();
      desenharCercas();
      pintarTudo();
    } catch (e) {
      faixa(e.message);
    }
  };
  atualizarBarraCerca();
}

function atualizarBarraCerca() {
  if (!podeEditarCercas()) return;
  const ativo = desenhando !== null;
  el("b-nova-cerca").style.display = ativo ? "none" : "";
  ["b-desfazer", "b-cancelar", "b-salvar"].forEach((i) => {
    el(i).style.display = ativo ? "" : "none";
  });
  el("b-salvar").disabled = !ativo || desenhando.length < 3;
  el("dica-cerca").textContent = ativo
    ? (desenhando.length < 3
        ? "Clique no mapa para marcar os cantos do lugar (mínimo 3)."
        : desenhando.length + " pontos — clique em Salvar quando fechar o contorno.")
    : "";
}

/**
 * As cercas existentes, mais a que está sendo desenhada. Elas ficam por baixo
 * da rota e dos pins: servem de fundo, não podem competir com o ativo.
 */
function desenharCercas() {
  if (!camadaCercas) return;
  camadaCercas.clearLayers();

  cercas.forEach((c) => {
    if (!c.pontos || c.pontos.length < 3) return;
    const poli = L.polygon(c.pontos.map((p) => [p.lat, p.lng]), {
      color: "#2E7D74", weight: 2, opacity: .8, fillColor: "#2E7D74", fillOpacity: .08,
    }).addTo(camadaCercas);
    poli.bindTooltip('<div class="balao"><div class="tit">' + escapar(c.nome) + "</div></div>",
      { direction: "top", className: "balao", opacity: 1 });
    if (podeEditarCercas()) {
      poli.on("click", async (ev) => {
        if (desenhando) return;               // desenhando, o clique é vértice
        L.DomEvent.stop(ev);
        if (!confirm('Apagar a cerca "' + c.nome + '"? Os lugares voltam a aparecer como coordenada.')) return;
        try {
          await removerCerca(c.id);
          cercas = await carregarCercas();
          desenharCercas();
          pintarTudo();
        } catch (e) { faixa(e.message); }
      });
    }
  });

  if (desenhando && desenhando.length) {
    desenhando.forEach((p) => {
      L.circleMarker([p.lat, p.lng], {
        radius: 4, color: "#16202B", weight: 2, fillColor: "#fff", fillOpacity: 1,
      }).addTo(camadaCercas);
    });
    if (desenhando.length > 1) {
      const contorno = fechar(desenhando);
      L.polyline(contorno.map((p) => [p.lat, p.lng]),
        { color: "#16202B", weight: 2, dashArray: "5 4" }).addTo(camadaCercas);
    }
  }
}

async function buscar() {
  try {
    aparelhos = await carregarAparelhos();
    await atualizarHistorico();
    ultimoContatoServidor = Date.now();
    falhaAtual = null;
    faixa(null);
  } catch (e) {
    // Falhou: NÃO limpa o que está na tela. Dado velho rotulado como velho
    // serve; tela vazia não serve para nada, e tela vazia num painel de
    // parede parece pátio sem locomotiva. Quem avisa é o indicador de
    // contato no cabeçalho, que continua contando a idade do dado.
    //
    // Também não desiste: o intervalo de 15 s segue chamando esta função,
    // e é essa repetição que faz o painel voltar sozinho quando a rede
    // volta — sem ninguém apertar nada (CONTEXTO-VTU 5.4).
    falhaAtual = e.message;
    faixa("Sem contato com o servidor (" + e.message +
      "). A tela mostra a última informação recebida e volta sozinha quando a rede voltar.");
    atualizarContato();
    return;
  }
  // As cercas mudam de vez em quando, não de 15 em 15 segundos: se o
  // servidor ainda não as tem, o monitor continua funcionando com
  // coordenadas em vez de nomes, e não é isso que vai derrubar a tela.
  try {
    cercas = await carregarCercas();
    desenharCercas();
  } catch (e) {
    cercas = [];
  }
  vinculos = await carregarVinculos();
  pintarTudo();
}

/* ---------------- idade do dado (CONTEXTO-VTU 2 e 5.4) ----------------
   Perda de sinal nunca pode ser silenciosa. Vale para o aparelho no pátio e
   vale para o próprio painel: um monitor que parou de receber tem a mesma
   cara de um pátio onde nada se move, e o programador não tem como saber a
   diferença olhando. Então a idade do dado fica escrita o tempo todo.
-------------------------------------------------------------------- */

const CONTATO_VELHO_MS = 60 * 1000;
const CONTATO_PERDIDO_MS = 3 * 60 * 1000;

function atualizarContato() {
  const caixa = el("contato");
  const texto = el("contato-txt");
  if (!caixa || !texto) return;

  if (!ultimoContatoServidor) {
    caixa.className = "contato";
    texto.textContent = falhaAtual ? "sem contato" : "conectando…";
    return;
  }
  const idade = Date.now() - ultimoContatoServidor;
  caixa.className = "contato" +
    (idade >= CONTATO_PERDIDO_MS ? " perdido" : idade >= CONTATO_VELHO_MS ? " velho" : "");
  texto.textContent = idade < 20000
    ? "ao vivo · " + relogioMs(ultimoContatoServidor)
    : "sem atualizar há " + duracao(idade);
}

/* ---------------- modo painel de parede (CONTEXTO-VTU 5.4) ----------------
   O que o gerente descreveu é uma tela sempre ligada ao lado do programador,
   lida de alguns metros e de pé — não um site que alguém abre e fecha. Aqui
   isso é: letra grande, sem os controles que ninguém opera a essa distância,
   tela cheia sem barra de navegador, e a tela sem apagar sozinha.

   A escolha fica guardada: quem liga o painel de manhã não deve ter de
   reconfigurá-lo todo dia.
------------------------------------------------------------------------ */

const CHAVE_PAREDE = "rastreio.monitor.parede";
let travaDeTela = null;

async function segurarTela() {
  // wakeLock não existe em todo navegador, e some sozinho quando a aba perde
  // o foco. Falhar aqui não pode derrubar nada: no pior caso a tela apaga e
  // alguém encosta no mouse.
  try {
    if (!("wakeLock" in navigator)) return;
    travaDeTela = await navigator.wakeLock.request("screen");
  } catch (e) {}
}

function aplicarParede(ligado) {
  document.body.classList.toggle("parede", ligado);
  el("b-parede").textContent = ligado ? "Sair do painel" : "Painel";
  try { localStorage.setItem(CHAVE_PAREDE, ligado ? "1" : "0"); } catch (e) {}
  // A grade mudou de tamanho; sem isto o Leaflet desenha o mapa no espaço
  // antigo e sobra uma faixa cinza.
  if (mapa) setTimeout(function () { mapa.invalidateSize(); }, 60);
  if (ligado) segurarTela();
}

function prepararModoParede() {
  let ligado = false;
  try { ligado = localStorage.getItem(CHAVE_PAREDE) === "1"; } catch (e) {}
  aplicarParede(ligado);

  el("b-parede").onclick = function () {
    const novo = !document.body.classList.contains("parede");
    aplicarParede(novo);
    // Tela cheia só pode ser pedida dentro de um clique — por isso mora aqui
    // e não na hora de restaurar a preferência.
    try {
      if (novo) document.documentElement.requestFullscreen();
      else if (document.fullscreenElement) document.exitFullscreen();
    } catch (e) {}
  };

  // A trava de tela cai quando a aba vai para segundo plano e não volta
  // sozinha. Sem isto, o painel apaga depois da primeira vez que alguém
  // troca de janela.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" &&
        document.body.classList.contains("parede")) {
      segurarTela();
    }
  });
}

/* ---------------- desenho ---------------- */

function pintarTudo() {
  el("cab-titulo").textContent = aparelhos.length
    ? aparelhos.length + (aparelhos.length === 1 ? " ativo" : " ativos")
    : "Nenhum aparelho ainda";
  desenharPins();
  desenharRota();
  desenharPainelLateral();
  atualizarRotuloTempo();
  atualizarContato();
}

/**
 * Um pin por ativo, sempre todos, na posição do instante mostrado. O mapa
 * abre assim (item 5): a rota só entra quando alguém escolhe um ativo.
 */
function desenharPins() {
  const vivos = new Set();

  aparelhos.forEach((a) => {
    const chave = chaveDe(a);
    const estado = estadoDe(chave);
    if (!estado.posicao) return;
    vivos.add(chave);

    const onde = [estado.posicao.lat, estado.posicao.lng];
    let pin = pins.get(chave);
    if (!pin) {
      pin = L.marker(onde, { icon: iconePin(estado, false) }).addTo(mapa);
      pin.on("click", () => {
        selecionado = selecionado === chave ? null : chave;
        enquadrado = false;
        pintarTudo();
      });
      pins.set(chave, pin);
    } else {
      pin.setLatLng(onde);
      pin.setIcon(iconePin(estado, selecionado === chave));
    }
    pin.bindTooltip(balaoAtivo(chave, estado), {
      direction: "top", className: "balao", opacity: 1,
    });
  });

  // Aparelho que sumiu da lista do servidor não pode deixar pin órfão.
  [...pins.keys()].forEach((chave) => {
    if (!vivos.has(chave)) { pins.get(chave).remove(); pins.delete(chave); }
  });

  if (!enquadrado && pins.size) {
    const alvos = selecionado && pins.has(selecionado) ? [pins.get(selecionado)] : [...pins.values()];
    mapa.fitBounds(L.latLngBounds(alvos.map((p) => p.getLatLng())),
      { padding: [60, 60], maxZoom: selecionado ? 16 : 15 });
    enquadrado = true;
  }
}

/**
 * A rota das últimas 24 h do ativo escolhido: a linha, um pontinho a cada
 * 500 m percorridos e um balão em cada parada. Só do escolhido — com todos
 * ao mesmo tempo o mapa vira um rabisco.
 */
function desenharRota() {
  camadaRota.clearLayers();
  if (!selecionado) return;

  const pontos = janelaDe(selecionado, HORAS_ROTA);
  const t = prepararTrilha(pontos);
  if (t.trilha.length > 1) {
    L.polyline(t.trilha.map((p) => [p.lat, p.lng]),
      { color: "#16202B", weight: 3, opacity: .55, lineJoin: "round" }).addTo(camadaRota);
    // marcosDeDistancia vem do núcleo: é a mesma conta que o app faz.
    marcosDeDistancia(t.trilha).forEach((m) => {
      L.circleMarker([m.lat, m.lng], {
        radius: 3.5, color: "#16202B", weight: 1.5, fillColor: "#fff", fillOpacity: 1
      }).bindTooltip(
        '<span class="marco">' + relogio(m.hora) + " · " + (m.metros / 1000).toFixed(1) + " km</span>",
        { direction: "top", className: "balao", opacity: 1 }
      ).addTo(camadaRota);
    });
  }

  calcularTrechos(pontos).forEach((tr) => {
    if (tr.tipo !== "parada" || !tr.ancora) return;
    L.circleMarker([tr.ancora.lat, tr.ancora.lng], {
      radius: 6, color: "#16202B", weight: 2, fillColor: "#EDF1F5", fillOpacity: .9
    }).bindTooltip(
      '<div class="balao"><div class="tit">Parada</div>' +
      "<div>" + relogioMs(tr.inicio) + " às " + relogioMs(tr.fim) + "</div>" +
      '<div class="cinza">' + duracao(tr.fim - tr.inicio) + " · " +
      escapar(lugarDe(tr.ancora)) + "</div></div>",
      { direction: "top", className: "balao", opacity: 1 }
    ).addTo(camadaRota);
  });
}

/* ---------------- lista e detalhe (item 8) ---------------- */

function desenharPainelLateral() {
  const c = el("lista");
  c.innerHTML = "";

  if (!aparelhos.length) {
    c.innerHTML = '<p style="font-size:14px;line-height:1.5;color:var(--suave);padding:8px 2px">'
      + "Nenhum aparelho enviou dados ainda. Ligue o rastreio no app do celular.</p>";
    return;
  }
  if (selecionado) { desenharDetalhe(c); return; }

  const grupos = [];
  aparelhos.forEach((a) => { if (grupos.indexOf(a.grupo) < 0) grupos.push(a.grupo); });

  grupos.forEach((g) => {
    const t = document.createElement("div");
    t.className = "secao";
    t.textContent = g;
    c.appendChild(t);

    aparelhos.filter((a) => a.grupo === g).forEach((a) => {
      const chave = chaveDe(a);
      const e = estadoDe(chave);
      const d = document.createElement("div");
      d.className = "item";
      d.innerHTML =
        '<span class="bola" style="background:' + (COR_FAROL[e.farol] || "var(--parado)") + '"></span>' +
        '<div class="corpo">' +
          '<div class="nome"><span class="n"></span>' +
            '<span class="' + (e.sinal.mudo ? "mudo" : "") + '">' + ondas(e.sinal.barras) + "</span>" +
          "</div>" +
          '<div class="campo"><b class="st"></b></div>' +
          '<div class="campo lc"></div>' +
        "</div>";
      // O prefixo da loco, não o nome do celular (CONTEXTO-VTU 5.1). Sem
      // vínculo cadastrado, cai no nome do aparelho — a tela diz o que sabe.
      d.querySelector(".n").textContent = rotuloDe(chave);
      d.querySelector(".st").textContent = textoStatus(e);
      d.querySelector(".lc").textContent = lugarDe(e.posicao) +
        " · última posição " + relogioMs(e.ultimoContatoMs);
      d.onclick = () => { selecionado = chave; enquadrado = false; pintarTudo(); };
      c.appendChild(d);
    });
  });
}

function desenharDetalhe(c) {
  const e = estadoDe(selecionado);
  const pontos = janelaDe(selecionado, HORAS_ROTA);
  const trechos = calcularTrechos(pontos);
  const lugares = resumoPorLugar(trechos, lugarDe);
  const s = e.sinal;

  // A cobertura do MESMO período dos totais logo abaixo (CONTEXTO-VTU 5.2).
  // Sem ela, "parado 3h40" é um número sem denominador: ninguém sabe se o
  // rastreio esteve vivo essas 3h40 inteiras, e o primeiro questionamento
  // derruba o número junto com a credibilidade do resto.
  // Recebe o histórico inteiro, não a janela: a última notícia ANTES do
  // começo do período é o que diz se ele começou coberto ou no escuro.
  const fim = relogioAtual();
  const cob = cobertura(historico.get(selecionado) || [],
    fim - HORAS_ROTA * 3600 * 1000, fim);

  const voltar = document.createElement("div");
  voltar.className = "volta";
  voltar.textContent = "← todos os ativos";
  voltar.onclick = () => { selecionado = null; enquadrado = false; pintarTudo(); };
  c.appendChild(voltar);

  const caixa = document.createElement("div");
  caixa.className = "detalhe";
  caixa.innerHTML =
    "<h2></h2>" +
    '<div class="kicker" style="margin-top:2px"></div>' +
    '<div style="margin-top:12px">' +
      '<div class="linha-campo"><span class="rot">Status</span><span class="val st"></span></div>' +
      '<div class="linha-campo"><span class="rot">Localidade</span><span class="val lc"></span></div>' +
      '<div class="linha-campo"><span class="rot">Sinal</span><span class="val sn"></span></div>' +
      '<div class="linha-campo"><span class="rot">Última posição</span><span class="val up"></span></div>' +
      '<div class="linha-campo"><span class="rot">Locomotiva</span><span class="val lo"></span></div>' +
    "</div>" +
    '<div class="vinc-barra" style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap"></div>' +
    '<div class="secao">Onde ficou nas últimas ' + HORAS_ROTA + " h</div>" +
    '<div class="cob" style="font-size:12px;color:var(--suave);line-height:1.5;margin-bottom:6px"></div>' +
    '<div class="lugares"></div>' +
    '<div class="secao">Trechos</div>' +
    '<div class="trechos"></div>';

  const aparelho = nomeDe(selecionado);
  const grupo = grupoDe(selecionado);
  const loco = prefixoEm(vinculos, grupo, aparelho, fim);

  caixa.querySelector("h2").textContent = rotuloDe(selecionado);
  caixa.querySelector(".kicker").textContent = grupo + " · aparelho " + aparelho;
  caixa.querySelector(".st").textContent = textoStatus(e);
  caixa.querySelector(".st").style.color = COR_FAROL[e.farol] || "";
  caixa.querySelector(".lc").textContent = lugarDe(e.posicao);
  caixa.querySelector(".sn").innerHTML = ondas(s.barras) + " " +
    escapar(s.mudo ? "sem sinal há " + duracao(s.minutos * 60000)
      : s.nivel === "fraco" ? "fraco" : "bom");
  caixa.querySelector(".up").textContent = e.ultimoContatoMs
    ? relogioMs(e.ultimoContatoMs) + " (" + duracao(fim - e.ultimoContatoMs) + ")"
    : "—";
  caixa.querySelector(".lo").textContent = loco || "sem vínculo";
  if (!loco) caixa.querySelector(".lo").style.color = "var(--suave)";

  montarBotoesDeVinculo(caixa.querySelector(".vinc-barra"), grupo, aparelho, loco);

  const alvoCob = caixa.querySelector(".cob");
  if (cob.percentual == null) {
    alvoCob.textContent = "";
  } else {
    alvoCob.textContent = "Rastreio vivo em " + textoCobertura(cob) +
      (cob.mudoMs > 0 ? " · " + duracao(cob.mudoMs) + " sem notícia" : "") +
      ". Os tempos abaixo valem para o que foi observado.";
    if (cob.percentual < 90) alvoCob.style.color = "var(--morno)";
  }

  const alvoLugares = caixa.querySelector(".lugares");
  if (!lugares.length) {
    alvoLugares.innerHTML = '<p class="campo" style="color:var(--suave)">Sem parada registrada no período.</p>';
  } else {
    lugares.forEach((l) => {
      const d = document.createElement("div");
      d.className = "lugar";
      d.innerHTML = '<span class="nom"></span><span class="dur"></span>';
      d.querySelector(".nom").textContent = l.lugar + (l.visitas > 1 ? " (" + l.visitas + "×)" : "");
      d.querySelector(".dur").textContent = duracao(l.total);
      alvoLugares.appendChild(d);
    });
  }

  const alvoTrechos = caixa.querySelector(".trechos");
  const emOrdem = trechos.slice().reverse();
  if (!emOrdem.length) {
    alvoTrechos.innerHTML = '<p class="campo" style="color:var(--suave)">Sem histórico no período.</p>';
  } else {
    emOrdem.forEach((t) => {
      const d = document.createElement("div");
      d.className = "lugar";
      d.innerHTML = '<span class="nom"></span><span class="dur"></span>';
      d.querySelector(".nom").textContent = relogioMs(t.inicio) + " · " +
        (t.tipo === "parada" ? lugarDe(t.ancora) : "em movimento");
      d.querySelector(".dur").textContent = duracao(t.fim - t.inicio);
      alvoTrechos.appendChild(d);
    });
  }

  c.appendChild(caixa);
}

/**
 * Vincular e encerrar a locomotiva deste aparelho.
 *
 * Trocar de loco NÃO apaga o vínculo anterior: fecha o antigo no instante em
 * que o novo começa. O percurso de ontem continua sendo da loco de ontem —
 * é essa a razão de o vínculo ter vigência, e é o que separa um histórico
 * que se pode citar de um que mente sobre o passado.
 */
function montarBotoesDeVinculo(barra, grupo, aparelho, loco) {
  if (!podeEditarVinculos()) {
    if (!loco) {
      barra.innerHTML = '<span style="font-size:12px;color:var(--suave);line-height:1.5">' +
        "Entre com a senha da família para dar o prefixo da locomotiva a este aparelho.</span>";
    }
    return;
  }

  const botao = (texto, aoClicar) => {
    const b = document.createElement("button");
    b.className = "fantasma";
    b.textContent = texto;
    b.onclick = aoClicar;
    barra.appendChild(b);
  };

  const recarregar = async () => {
    vinculos = await carregarVinculos();
    pintarTudo();
  };

  botao(loco ? "Trocar de locomotiva" : "Vincular locomotiva", async () => {
    const prefixo = (prompt(
      "Prefixo da locomotiva que está com o aparelho \"" + aparelho + "\":",
      loco || ""
    ) || "").trim();
    if (!prefixo) return;
    try {
      await criarVinculo(grupo, aparelho, prefixo);
      faixa(null);
      await recarregar();
    } catch (e) {
      faixa(e.message);
    }
  });

  if (!loco) return;

  botao("Encerrar vínculo", async () => {
    const aberto = vinculoEm(vinculos, grupo, aparelho, Date.now());
    if (!aberto || aberto.ate != null) { faixa("Não há vínculo aberto para encerrar."); return; }
    if (!confirm("Encerrar o vínculo do aparelho \"" + aparelho + "\" com a locomotiva " +
      loco + "?\n\nO histórico até agora continua sendo dela.")) return;
    try {
      await fecharVinculo(aberto.id);
      faixa(null);
      await recarregar();
    } catch (e) {
      faixa(e.message);
    }
  });
}

/* ---------------- timeline (item 6) ----------------
   A barra anda em minutos ao longo dos últimos 7 dias e o extremo direito é
   sempre o agora. Arrastar não busca nada no servidor: o histórico já está
   aqui, e o que muda é o relógio com que tudo é recalculado — pins, farol,
   status e rota voltam juntos para aquele momento.
--------------------------------------------------- */

const MINUTOS_TIMELINE = DIAS_TIMELINE * 24 * 60;

function iniciarTimeline() {
  const barra = el("t-barra");
  barra.max = String(MINUTOS_TIMELINE);
  barra.value = String(MINUTOS_TIMELINE);

  barra.addEventListener("input", () => {
    const atras = MINUTOS_TIMELINE - Number(barra.value);
    instante = atras === 0 ? null : Date.now() - atras * 60000;
    pintarTudo();
  });
  el("b-agora").onclick = () => {
    instante = null;
    barra.value = String(MINUTOS_TIMELINE);
    pintarTudo();
  };
  atualizarRotuloTempo();
}

function atualizarRotuloTempo() {
  const passado = instante != null;
  el("tempo").classList.toggle("passado", passado);
  el("t-quando").textContent = passado ? diaEHora(instante) : "agora · " + diaEHora(Date.now());
}

/* ---------------- início ---------------- */

const salvo = recuperar();
if (salvo && salvo.nome && salvo.senha) {
  acesso = salvo;
  abrirPainel();
} else {
  el("i-nome").focus();
}
</script>
